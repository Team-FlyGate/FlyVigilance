<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FlyGate Teaser 15s</title>
<meta name="description" content="Project-FlyGate 15초 티저: 시판 전 표적 결합(FlyDiscovery)부터 시판 후 이상사례(FlyVigilance)까지 에이전트 하나로 잇습니다" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; color: #eef3ff; }
  #wrap { position: fixed; inset: 0; overflow: hidden; }
  /* 무대의 가운데를 창 가운데에 맞춘 뒤 창 크기에 맞게 줄입니다. 크기는 스크립트가 방향(가로·세로)에 맞춰 정합니다 */
  #stage { position: absolute; left: 50%; top: 50%; overflow: hidden; background: #04060c; transform-origin: center center; transform: translate(-50%, -50%); }
  #cv { position: absolute; left: 0; top: 0; display: block; }
  #hud { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; padding: 12px 18px; display: flex; align-items: center; gap: 14px; background: linear-gradient(transparent, rgba(0,0,0,.85)); opacity: 0; transition: opacity .3s; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; color: #9fb0d6; }
  #wrap:hover + #hud, #hud:hover { opacity: 1; }
  #hud button { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  #scrub { flex: 1; accent-color: #37e6ff; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>
<div id="hud"><button id="pp" type="button">❚❚</button><span id="clock">0.0</span><input id="scrub" type="range" min="0" max="15" step="0.02" value="0" /></div>
<script>
(() => {
  'use strict'
  // 빌드 스크립트(scripts/build_teaser15.py)가 실측 수치를 여기에 넣습니다
  const D = /*__DATA__*/null

  // =====================================================================
  //  결정론적 타임라인: 모든 장면은 시간 t 의 순수 함수입니다.
  //  render_reel.py 는 ?paused=1 로 열고 window.__reel.renderAt(t) 로 프레임을 하나씩 그립니다.
  //  세로판(1080×1920)은 빌드가 VERT 를 true 로 바꾼 파일이거나, 이 파일에 ?v=1 을 붙여 엽니다.
  // =====================================================================
  const Q = new URLSearchParams(location.search)
  const VERT = /*__VERT__*/false || Q.get('v') === '1'
  const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080, FPS = 30, CX = W / 2
  const PAUSED = Q.has('paused')
  const stage = document.getElementById('stage'), cv = document.getElementById('cv'), X = cv.getContext('2d')
  stage.style.width = cv.style.width = W + 'px'; stage.style.height = cv.style.height = H + 'px'
  let R = 1

  // ---------- 수학 ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
  const lerp = (a, b, t) => a + (b - a) * t
  const inv = (a, b, x) => clamp((x - a) / (b - a))
  const E = {
    lin: (t) => t, out2: (t) => 1 - (1 - t) * (1 - t), out3: (t) => 1 - Math.pow(1 - t, 3), out5: (t) => 1 - Math.pow(1 - t, 5),
    in3: (t) => t * t * t, inOut3: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    expoOut: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    backOut: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2) },
  }
  const seg = (t, a, b, e = E.out3) => e(inv(a, b, t))
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
  const fmtInt = (n) => Math.round(n).toLocaleString('en-US')
  const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' }
  const sup = (n) => String(n).split('').map((c) => SUP[c] ?? c).join('')
  function pText(p) {
    if (p >= 0.001) return `p = ${+p.toFixed(4)}`
    let e = Math.floor(Math.log10(p)), m = Math.round(p / Math.pow(10, e))
    if (m >= 10) { m = 1; e += 1 }
    return `p ≈ ${m}×10${sup(e)}`
  }

  // ---------- 색 · 글꼴 (쇼릴 v3 와 같은 토큰) ----------
  const C = {
    bg: '#04060c', text: '#eef3ff', white: '#f4f7ff', t2: '#a9b6d3', t3: '#6f7d9e', line: 'rgba(120,170,255,0.16)', line2: 'rgba(120,170,255,0.30)',
    cyan: '#37e6ff', blue: '#4d8dff', amber: '#ffb547', magenta: '#ff4fd8', nv: '#76b900', nvl: '#c8f36b', red: '#ff5d6c',
    ok: '#3ddc97', violet: '#a58bff', cream: '#efe8da',
  }
  const SANS = 'system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif'
  const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'

  // ---------- 그리기 도구 ----------
  let GA = 1  // 전역 불투명도(장면 안에서 곱해 나갑니다)
  const alpha = (a) => { X.globalAlpha = clamp(GA * a) }
  function withA(k, fn) { const g = GA; GA = g * clamp(k); if (GA > 0.002) fn(); GA = g }
  const font = (size, weight = 700, fam = SANS) => { X.font = `${weight} ${size}px ${fam}` }
  const MC = new Map()
  function measure(s, size, weight = 700, fam = SANS, track = 0) {
    const key = `${s}|${size}|${weight}|${fam === MONO ? 'm' : 's'}|${track}`
    let w = MC.get(key)
    if (w === undefined) { X.save(); font(size, weight, fam); X.letterSpacing = track + 'px'; w = X.measureText(s).width; X.restore(); MC.set(key, w) }
    return w
  }
  function text(s, x, y, o = {}) {
    const { size = 32, weight = 700, fam = SANS, color = C.text, a = 1, align = 'left', base = 'alphabetic', track = 0, glow = 0, maxW = 0 } = o
    if (!s || GA * a <= 0.003) return 0
    let sz = size
    if (maxW) { const w0 = measure(s, size, weight, fam, track); if (w0 > maxW) sz = size * maxW / w0 }
    X.save(); font(sz, weight, fam); X.letterSpacing = track + 'px'; X.textAlign = align; X.textBaseline = base; alpha(a); X.fillStyle = color
    if (glow) { X.shadowColor = color; X.shadowBlur = glow }
    X.fillText(s, x, y); const w = X.measureText(s).width; X.restore(); return w
  }
  // 여러 색 조각을 한 줄로: [[문자열, 색, 굵기?], ...]
  function rich(parts, x, y, o = {}) {
    const { size = 32, weight = 700, fam = SANS, a = 1, align = 'left', maxW = 0, glow = 0 } = o
    let sz = size
    const total = () => parts.reduce((s, p) => s + measure(p[0], sz, p[2] ?? weight, fam), 0)
    let tw = total()
    if (maxW && tw > maxW) { sz = size * maxW / tw; tw = total() }
    let cx = align === 'center' ? x - tw / 2 : align === 'right' ? x - tw : x
    for (const p of parts) { text(p[0], cx, y, { size: sz, weight: p[2] ?? weight, fam, color: p[1] ?? C.text, a, glow }); cx += measure(p[0], sz, p[2] ?? weight, fam) }
    return tw
  }
  // 글자별로 마스크 아래에서 솟아오르기(FDDD 쇼릴의 키네틱 타입). maxW 를 넘으면 글자 크기를 줄입니다.
  function riseParts(parts, x, y, p, o = {}) {
    const { weight = 800, stagger = 0.04, dur = 0.5, align = 'left', fam = SANS, glow = 0, maxW = 0 } = o
    let size = o.size ?? 100
    if (p <= 0 || GA <= 0.003) return 0
    let total = parts.reduce((s, q) => s + measure(q[0], size, weight, fam), 0)
    if (maxW && total > maxW) { size = size * maxW / total; total = maxW }
    let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x
    X.save(); X.beginPath(); X.rect(cx - 60, y - size * 1.15, total + 120, size * 1.5); X.clip()
    font(size, weight, fam); X.letterSpacing = '0px'; X.textBaseline = 'alphabetic'; X.textAlign = 'left'
    let i = 0
    for (const [str, col] of parts) {
      X.fillStyle = col
      if (glow) { X.shadowColor = col; X.shadowBlur = glow }
      for (const ch of [...str]) {
        const k = E.expoOut(clamp((p - i * stagger) / dur))
        alpha(clamp(k * 1.4)); X.fillText(ch, cx, y + (1 - k) * size * 1.1)
        cx += X.measureText(ch).width; i++
      }
    }
    X.restore(); return total
  }
  // 모노 타자기
  function typeText(s, x, y, p, o = {}) {
    const full = { fam: MONO, weight: 600, size: 20, color: C.t3, track: 5, ...o }
    const n = Math.floor(clamp(p) * (s.length + 1))
    if (n <= 0) return 0
    const cur = p > 0 && p < 1.05 && Math.floor(p * 24) % 2 === 0 ? '▌' : ''
    let x0 = x
    if (full.align === 'center') x0 = x - measure(s, full.size, full.weight, full.fam, full.track) / 2
    return text(s.slice(0, n) + cur, x0, y, { ...full, align: 'left' })
  }
  const rr = (x, y, w, h, r) => { X.beginPath(); X.roundRect(x, y, w, h, r) }
  function panel(x, y, w, h, o = {}) {
    const { r = 20, fill = 'rgba(10,16,32,0.80)', stroke = C.line, lw = 1, a = 1, glow = null, top = null } = o
    if (GA * a <= 0.003) return
    X.save(); alpha(a); rr(x, y, w, h, r); X.fillStyle = fill
    if (glow) { X.shadowColor = glow; X.shadowBlur = 40 }
    X.fill(); X.shadowBlur = 0
    if (stroke) { X.strokeStyle = stroke; X.lineWidth = lw; X.stroke() }
    if (top) { X.beginPath(); X.roundRect(x, y, w, 5, [r, r, 0, 0]); X.fillStyle = top; X.fill() }
    X.restore()
  }
  function line(x1, y1, x2, y2, color, a = 1, w = 1, glow = 0) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); X.strokeStyle = color; X.lineWidth = w; X.lineCap = 'round'
    if (glow) { X.shadowColor = color; X.shadowBlur = glow }
    X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2, y2); X.stroke(); X.restore()
  }
  function dot(x, y, r, color, a = 1, glow = 0) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); X.fillStyle = color; if (glow) { X.shadowColor = color; X.shadowBlur = glow }
    X.beginPath(); X.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); X.fill(); X.restore()
  }
  function ring(x, y, r, color, a = 1, w = 2) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); X.strokeStyle = color; X.lineWidth = w; X.beginPath(); X.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); X.stroke(); X.restore()
  }
  function brackets(x, y, w, h, s = 18, color = '#ffffff', a = 0.5, lw = 1.5) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); X.strokeStyle = color; X.lineWidth = lw; X.beginPath()
    X.moveTo(x, y + s); X.lineTo(x, y); X.lineTo(x + s, y); X.moveTo(x + w - s, y); X.lineTo(x + w, y); X.lineTo(x + w, y + s)
    X.moveTo(x + w, y + h - s); X.lineTo(x + w, y + h); X.lineTo(x + w - s, y + h); X.moveTo(x + s, y + h); X.lineTo(x, y + h); X.lineTo(x, y + h - s)
    X.stroke(); X.restore()
  }
  function check(x, y, s, color, a = 1, w = 3) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); X.strokeStyle = color; X.lineWidth = w; X.lineCap = 'round'; X.lineJoin = 'round'
    X.beginPath(); X.moveTo(x - s * 0.5, y); X.lineTo(x - s * 0.12, y + s * 0.38); X.lineTo(x + s * 0.55, y - s * 0.42); X.stroke(); X.restore()
  }
  const CHIP = {
    nv: { fg: '#c8f36b', bd: 'rgba(118,185,0,.70)', bg: 'rgba(118,185,0,.14)' }, cyan: { fg: '#9fefff', bd: 'rgba(55,230,255,.60)', bg: 'rgba(55,230,255,.10)' },
    mag: { fg: '#ffa6ec', bd: 'rgba(255,79,216,.60)', bg: 'rgba(255,79,216,.10)' }, dim: { fg: '#a9b6d3', bd: 'rgba(120,170,255,.26)', bg: 'rgba(10,16,32,.66)' },
  }
  function chipW(label, size = 20, fam = MONO, h = 40) { return measure(label, size, 600, fam) + h * 0.9 }
  function chip(x, y, label, o = {}) {
    const { kind = 'dim', size = 20, h = 40, a = 1, align = 'left', fam = MONO } = o
    const K = CHIP[kind], w = chipW(label, size, fam, h)
    const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x
    if (GA * a <= 0.003) return w
    X.save(); alpha(a); rr(x0, y, w, h, h / 2); X.fillStyle = K.bg; X.fill(); X.strokeStyle = K.bd; X.lineWidth = 1.4; X.stroke(); X.restore()
    text(label, x0 + w / 2, y + h / 2 + 1, { size, weight: 600, fam, color: K.fg, a, align: 'center', base: 'middle' })
    return w
  }
  function bar(x, y, w, h, frac, color, o = {}) {
    const { a = 1, bg = 'rgba(120,170,255,0.10)', glow = 0 } = o
    if (GA * a <= 0.003) return
    X.save(); alpha(a); rr(x, y, w, h, h / 2); X.fillStyle = bg; X.fill()
    if (frac > 0) { rr(x, y, Math.max(h, w * clamp(frac)), h, h / 2); X.fillStyle = color; if (glow) { X.shadowColor = color; X.shadowBlur = glow } X.fill() }
    X.restore()
  }
  // 고무도장: 크게 찍혔다가 제자리로
  function stamp(x, y, label, color, k, o = {}) {
    if (k <= 0 || GA <= 0.003) return
    const { size = 44, rot = -0.12, sub = '' } = o
    const s = lerp(1.9, 1, E.backOut(clamp(k)))
    X.save(); alpha(clamp(k * 2.2)); X.translate(x, y); X.rotate(rot); X.scale(s, s)
    font(size, 900); X.letterSpacing = '2px'
    const tw = X.measureText(label).width, w = tw + size * 0.9, h = size * (sub ? 1.8 : 1.4)
    rr(-w / 2, -h / 2, w, h, 12); X.fillStyle = color + '22'; X.fill(); X.lineWidth = 4; X.strokeStyle = color; X.stroke()
    X.fillStyle = color; X.textAlign = 'center'; X.textBaseline = 'middle'
    X.fillText(label, 0, sub ? -size * 0.2 : 2)
    if (sub) { font(size * 0.34, 700, MONO); X.letterSpacing = '4px'; X.fillText(sub, 0, size * 0.52) }
    X.restore()
  }
  function glowBlob(x, y, r, color, a = 1) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); const g = X.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)')
    X.fillStyle = g; X.fillRect(x - r, y - r, r * 2, r * 2); X.restore()
  }
  // 오도미터 숫자: 자리마다 굴러가며 멈춥니다(쇼릴 v3 · FDDD 쇼릴과 같은 방식)
  function odometer(value, x, y, o = {}) {
    const { size = 120, weight = 800, color = C.text, align = 'left', decimals = 0, final = null, a = 1, fam = SANS, glow = 0 } = o
    if (GA * a <= 0.003) return 0
    const v = Math.abs(value)
    const intDigits = Math.max(1, Math.floor(Math.log10(Math.max(1, Math.abs(final ?? value)))) + 1)
    let scaled = v * Math.pow(10, decimals); if (Math.abs(scaled - Math.round(scaled)) < 1e-6) scaled = Math.round(scaled)
    const totalDigits = intDigits + decimals
    X.save(); font(size, weight, fam); X.letterSpacing = '0px'
    const dw = X.measureText('0').width, cw = X.measureText(',').width, pw = X.measureText('.').width
    const cells = []
    for (let k = totalDigits - 1; k >= 0; k--) {
      cells.push({ k }); const intK = k - decimals
      if (intK > 0 && intK % 3 === 0 && decimals === 0) cells.push({ sep: ',' })
      if (k === decimals && decimals > 0) cells.push({ sep: '.' })
    }
    while (cells.length > 1) {
      const c = cells[0]
      if (c.sep === ',') { cells.shift(); continue }
      if (c.sep || c.k <= decimals) break
      if (Math.floor(scaled / Math.pow(10, c.k)) % 10 === 0 && scaled < Math.pow(10, c.k)) { cells.shift(); continue }
      break
    }
    const width = cells.reduce((s, c) => s + (c.sep ? (c.sep === ',' ? cw : pw) : dw), 0)
    let cx = align === 'center' ? x - width / 2 : align === 'right' ? x - width : x
    X.restore()
    // 숫자는 잘라 낸 작은 캔버스에 그린 뒤 붙입니다. 빛번짐은 붙일 때 입혀서 잘린 사각형 가장자리가 보이지 않게 합니다.
    const pad = 20, ow = width + pad * 2, oh = size * 1.08, x0 = cx
    if (ODO.width !== Math.ceil(ow * R) || ODO.height !== Math.ceil(oh * R)) { ODO.width = Math.ceil(ow * R); ODO.height = Math.ceil(oh * R) }
    const g = ODO.getContext('2d')
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, ODO.width, ODO.height); g.setTransform(R, 0, 0, R, 0, 0)
    g.font = `${weight} ${size}px ${fam}`; g.letterSpacing = '0px'; g.fillStyle = color; g.textBaseline = 'alphabetic'; g.textAlign = 'left'
    const by = size * 0.9
    let gx = pad
    for (const c of cells) {
      if (c.sep) { g.fillText(c.sep, gx, by); gx += c.sep === ',' ? cw : pw; continue }
      const dv = scaled / Math.pow(10, c.k), d = Math.floor(dv) % 10
      const unit = Math.pow(10, c.k)
      const r = c.k === 0 ? 0 : E.inOut3(clamp((dv - Math.floor(dv)) * unit - (unit - 1)))
      const off = r * size * 0.92
      g.fillText(String(d), gx + (dw - g.measureText(String(d)).width) / 2, by - off)
      if (off > 0) g.fillText(String((d + 1) % 10), gx + (dw - g.measureText(String((d + 1) % 10)).width) / 2, by - off + size * 0.92)
      gx += dw
    }
    X.save(); alpha(a)
    if (glow) { X.shadowColor = color; X.shadowBlur = glow }
    X.drawImage(ODO, 0, 0, ODO.width, ODO.height, x0 - pad, y - by, ODO.width / R, ODO.height / R)
    X.restore(); return width
  }
  const ODO = document.createElement('canvas')
  const odoW = (final, size, decimals = 0) => {
    const s = decimals ? final.toFixed(decimals) : fmtInt(final)
    return [...s].reduce((w, ch) => w + measure(/\d/.test(ch) ? '0' : ch, size, 800), 0)
  }
  const count = (lt, t0, dur = 0.8) => E.out5(inv(t0, t0 + dur, lt))

  // ---------- 3D 투영 (단백질 · 리간드 · 뇌) ----------
  function rot3(p, yaw, pitch) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cx = Math.cos(pitch), sx = Math.sin(pitch)
    const x1 = p[0] * cy + p[2] * sy, z1 = -p[0] * sy + p[2] * cy
    return [x1, p[1] * cx - z1 * sx, p[1] * sx + z1 * cx]
  }
  const prj = (q, cx, cy, s, f = 1100) => { const k = f / (f + q[2] * s); return [cx + q[0] * s * k, cy - q[1] * s * k, k] }
  function molPrep(flat, el, bonds) {
    const P = []; for (let i = 0; i < flat.length; i += 3) P.push([flat[i], flat[i + 1], flat[i + 2]])
    const c = [0, 1, 2].map((k) => P.reduce((s, p) => s + p[k], 0) / P.length)
    let B = bonds
    if (!B) { B = []; for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) if (Math.hypot(P[i][0] - P[j][0], P[i][1] - P[j][1], P[i][2] - P[j][2]) < 1.75) B.push([i, j, 1]) }
    return { P, el: [...el], B, c }
  }
  const ELC = { C: '#f4efe4', N: '#6aa5ff', O: '#ff6b78', S: '#ffd24d' }
  function drawMol(m, pivot, cx, cy, s, yaw, pitch, o = {}) {
    const { a = 1, rAtom = 0.36, bw = 0.17, off = [0, 0, 0], glow = 0 } = o
    if (GA * a <= 0.003) return
    const S = m.P.map((p) => prj(rot3([p[0] - pivot[0] + off[0], p[1] - pivot[1] + off[1], p[2] - pivot[2] + off[2]], yaw, pitch), cx, cy, s))
    const prims = []
    m.B.forEach(([i, j, ord]) => prims.push({ k: (S[i][2] + S[j][2]) / 2 - 1e-4, b: [i, j, ord] }))
    for (let i = 0; i < S.length; i++) prims.push({ k: S[i][2], i })

        text(tl.title, x + 32, y + 64, { size: VERT ? 32 : 30, weight: 800, color: C.white, maxW: tw - 64 })
        const bw = text(tl.big, x + 32, y + th * 0.6, { size: VERT ? 124 : 120, weight: 900, color: C.nvl, glow: 26 })
        if (tl.unit) text(tl.unit, x + 40 + bw, y + th * 0.6, { size: 34, weight: 800, color: C.nvl })
        tl.sub.forEach((ln, j) => text(ln, x + 32, y + th - 78 + j * 36, { size: j ? 21 : 25, weight: j ? 600 : 800, color: j ? C.t2 : C.white, fam: j ? MONO : SANS, maxW: tw - 64 }))
      })
      X.restore()
    })
  }
  { const t = B0.stack; cue(t, 'hit', { g: 1 }); cue(t, 'glitch', { d: 0.08 }); TILES.forEach((_, i) => cue(t + 0.25 + i * 0.13, 'slam', { g: 0.7 + i * 0.1 }))
    cue(t + 0.9, 'riser', { d: 0.6, up: 1 }) }

  // ---------------- 08 마무리: 뇌 → FlyGate ----------------
  function endCard(lt, poster = false) {
    const bs = VERT ? 400 : 470, by = VERT ? LOGO.y - 70 : LOGO.y - 90
    const m = poster ? 1 : seg(lt, 0.12, 1.1, E.lin)
    cloud(lt + 3, CX, by, bs, poster ? 0.5 : 1, m, { spin: poster ? 0 : 0.4, yaw0: 0.1 })
    const solid = poster ? 1 : seg(lt, 0.9, 1.25)
    glowBlob(CX, LOGO.y - LOGO.size * 0.35, LOGO.size * 2.2, 'rgba(55,230,255,0.12)', solid)
    logoText(solid, 40)
    const t1 = poster ? 1 : seg(lt, 1.05, 1.3), t2 = poster ? 1 : seg(lt, 1.15, 1.4), t3 = poster ? 1 : seg(lt, 1.25, 1.5)
    const y1 = LOGO.y + (VERT ? 110 : 96)
    if (VERT) {
      // 슬로건: 분자에서 환자까지, 추론보다 근거가 먼저. FlyGate. (FlyGate 는 위 로고)
      text('분자에서 환자까지,', CX, y1, { size: 50, weight: 800, color: C.white, align: 'center', a: t1 })
      rich([['추론보다 ', C.t2, 800], ['근거가 먼저.', C.cyan, 800]], CX, y1 + 70, { size: 50, align: 'center', a: t1 })
    } else {
      rich([['분자에서 환자까지, ', C.white, 800], ['추론보다 ', C.t2, 800], ['근거가 먼저.', C.cyan, 800]], CX, y1, { size: 48, align: 'center', a: t1 })
    }
    const y2 = y1 + (VERT ? 190 : 84)
    text(D.meta.hack.toUpperCase(), CX, y2, { size: VERT ? 25 : 24, weight: 700, fam: MONO, color: C.nvl, align: 'center', track: VERT ? 3 : 5, a: t2, maxW: W - 120 })
    const url = D.meta.live.replace(/^https?:\/\//, '')
    withA(t3, () => {
      const cw = chipW(url, VERT ? 34 : 32, MONO, VERT ? 70 : 66)
      panel(CX - cw / 2, y2 + 40, cw, VERT ? 70 : 66, { r: 35, fill: 'rgba(55,230,255,0.10)', stroke: 'rgba(55,230,255,0.7)', lw: 2, glow: 'rgba(55,230,255,0.35)' })
      text(url, CX, y2 + 40 + (VERT ? 35 : 33) + 1, { size: VERT ? 34 : 32, weight: 700, fam: MONO, color: C.white, align: 'center', base: 'middle' })
    })
    const cr = 'NVIDIA NIM (BioNeMo · Nemotron) · NVIDIA Agent Skills · NemoClaw · OpenShell · FDA FAERS · MaleCNS v1.0 (Janelia FlyEM, CC BY 4.0)'
    const ca = poster ? 0.8 : seg(lt, 1.4, 1.7) * 0.8
    if (VERT) {
      text('NVIDIA NIM (BioNeMo · Nemotron) · NVIDIA Agent Skills · NemoClaw · OpenShell', CX, H - 190, { size: 16, weight: 500, fam: MONO, color: C.t3, align: 'center', a: ca, maxW: W - 140 })
      text('FDA FAERS · MaleCNS v1.0 (Janelia FlyEM, CC BY 4.0)', CX, H - 164, { size: 16, weight: 500, fam: MONO, color: C.t3, align: 'center', a: ca, maxW: W - 140 })
    } else text(cr, CX, H - 132, { size: 15, weight: 500, fam: MONO, color: C.t3, align: 'center', a: ca, maxW: W - 200 })
  }
  function sEnd(lt) { endCard(lt) }
  { const t = B0.end; cue(t, 'boom', { g: 1.1, big: 1 }); cue(t, 'whoosh', { d: 1.1 }); cue(t + 0.9, 'lock', { big: 1 }); cue(t + 0.95, 'tail', { d: 1.0 }); cue(t + 1.25, 'tick', { f: 1.6 }) }

  const DRAW = { poster: sPoster, hook: sHook, disc: sDisc, fv: sFV, serious: sSerious, work: sWork, auc: sAUC, stack: sStack, end: sEnd }

  // ---------- 공통 HUD (FDDD 쇼릴의 프레임 언어) ----------
  function hud(T, b) {
    const g = GA; GA = 1
    brackets(M, M, W - M * 2, H - M * 2, 22, '#ffffff', 0.3, 1.5)
    const bw = text('PROJECT-FLYGATE', M + 30, M + 34, { size: 15, weight: 700, fam: MONO, color: C.cream, track: 4 })
    text('/  TEASER 15s', M + 30 + bw + 12, M + 34, { size: 15, weight: 500, fam: MONO, color: C.t3, track: 2 })
    const f = Math.floor(T * FPS + 1e-6), ss = Math.floor(f / FPS), ff = f % FPS
    text(`TC 00:00:${String(ss).padStart(2, '0')}:${String(ff).padStart(2, '0')}`, W - M - 30, M + 34, { size: 15, weight: 500, fam: MONO, color: C.t3, align: 'right', track: 2 })
    const step = b.id === 'disc' ? 1 : ['fv', 'serious', 'work', 'auc'].includes(b.id) ? 2 : 0
    if (!VERT) {
      let px = W - M - 260
      for (const [l, n] of [['STEP 2 · 시판 후', 2], ['STEP 1 · 시판 전', 1]]) {
        const w = chipW(l, 13, MONO, 26); px -= w
        chip(px, M + 13, l, { kind: step === n ? (n === 1 ? 'cyan' : 'mag') : 'dim', size: 13, h: 26, a: step === n ? 1 : 0.5 }); px -= 10
      }
    }
    text(`${NUM[b.id]} — ${b.label}`, M + 30, H - M - 20, { size: 15, weight: 500, fam: MONO, color: C.cream, track: 2, maxW: W * 0.55 })
    text(`${W}×${H} · 30FPS · 실측 데이터`, W - M - 30, H - M - 20, { size: 14, weight: 500, fam: MONO, color: C.t3, align: 'right', track: 1 })
    const x0 = M + 30, x1 = W - M - 30, y = H - M - 46
    line(x0, y, x1, y, '#ffffff', 0.12, 1); line(x0, y, lerp(x0, x1, T / DUR), y, C.cyan, 0.9, 2)
    for (const s of BEATS.slice(1)) line(lerp(x0, x1, s.t0 / DUR), y - 4, lerp(x0, x1, s.t0 / DUR), y + 4, '#ffffff', 0.35, 1)
    GA = g
  }

  // ---------- 컷 효과: 글리치(RGB 분리 + 띠 밀림)와 섬광 ----------
  const GB = [0, 1, 2].map(() => document.createElement('canvas'))
  function glitchPost(k, seed) {
    const cw = cv.width, ch = cv.height
    for (const c of GB) if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch }
    const [org, rc, gbc] = GB.map((c) => c.getContext('2d'))
    org.globalCompositeOperation = 'copy'; org.drawImage(cv, 0, 0)
    for (const [g, col] of [[rc, '#ff0000'], [gbc, '#00ffff']]) {
      g.globalCompositeOperation = 'copy'; g.drawImage(cv, 0, 0)
      g.globalCompositeOperation = 'multiply'; g.fillStyle = col; g.fillRect(0, 0, cw, ch)
    }
    const dx = Math.round(k * 16 * R)
    X.save(); X.setTransform(1, 0, 0, 1, 0, 0)
    X.globalAlpha = 1; X.globalCompositeOperation = 'copy'; X.drawImage(GB[1], dx, 0)
    X.globalCompositeOperation = 'lighter'; X.drawImage(GB[2], -dx, 0)
    X.globalCompositeOperation = 'source-over'
    const n = 3 + Math.floor(k * 7)
    for (let i = 0; i < n; i++) {
      const y = Math.floor(hash(seed * 13.1 + i) * ch), h = Math.floor((0.01 + hash(seed * 7.7 + i) * 0.06) * ch), sh = Math.round((hash(seed * 3.3 + i) - 0.5) * k * 180 * R)
      X.drawImage(GB[0], 0, y, cw, h, sh, y, cw, h)
    }
    X.restore()
  }

  function render(T) {
    X.setTransform(R, 0, 0, R, 0, 0)
    X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; X.shadowBlur = 0
    X.drawImage(BG, 0, 0, W, H)
    const b = BEATS.find((s) => T >= s.t0 && T < s.t1) ?? BEATS[BEATS.length - 1]
    const lt = T - b.t0
    // 컷마다 살짝 당겨졌다가 제자리로 돌아오는 줌 펀치
    const z = b.id === 'poster' ? 1 : 1 + 0.045 * (1 - E.out3(clamp(lt / 0.4)))
    GA = 1; X.save(); X.translate(W / 2, H / 2); X.scale(z, z); X.translate(-W / 2, -H / 2)
    DRAW[b.id](lt, T)
    X.restore(); GA = 1
    hud(T, b)
    // 컷 직후 섬광
    if (b.id !== 'poster' && lt < 0.1) { X.save(); X.globalAlpha = 0.14 * (1 - lt / 0.1); X.fillStyle = '#ffffff'; X.fillRect(0, 0, W, H); X.restore() }
    // 필름 그레인
    if (!GRAIN_PAT) GRAIN_PAT = X.createPattern(GRAIN, 'repeat')
    const f = Math.floor(T * FPS)
    X.save(); X.globalAlpha = 0.035; X.globalCompositeOperation = 'overlay'; X.translate(-(hash(f) * 256) | 0, -(hash(f + 0.5) * 256) | 0)
    X.fillStyle = GRAIN_PAT; X.fillRect(0, 0, W + 256, H + 256); X.restore()
    // 컷 앞뒤 두세 프레임에 글리치
    for (const s of BEATS.slice(1)) {
      const d = T - s.t0
      if (d > -0.07 && d < 0.1) { glitchPost(d < 0 ? 1 + d / 0.07 * 0.5 : 1 - d / 0.1, Math.floor(T * FPS)); break }
    }
  }

  // ---------- 재생기 ----------
  let T = 0, playing = !PAUSED, last = performance.now(), manual = false
  if (Q.get('t')) T = parseFloat(Q.get('t'))
  const clock = document.getElementById('clock'), scrub = document.getElementById('scrub'), pp = document.getElementById('pp')
  scrub.max = DUR
  function frame(now) {
    const dt = (now - last) / 1000; last = now
    if (!manual) {
      if (playing) { T += dt; if (T >= DUR) T = Q.has('once') ? DUR - 1e-3 : T - DUR }   // 소셜 피드처럼 반복 재생합니다
      render(T)
      clock.textContent = `${T.toFixed(1)} / ${DUR.toFixed(1)}`; scrub.value = T
    }
    requestAnimationFrame(frame)
  }
  function fit() {
    const k = Math.min(innerWidth / W, innerHeight / H)
    stage.style.transform = `translate(-50%, -50%) scale(${k})`
    const r = PAUSED ? 1 : clamp((devicePixelRatio || 1) * k, 1, 2)
    if (Math.abs(r - R) > 0.01 || cv.width !== Math.round(W * r)) { R = r; cv.width = Math.round(W * R); cv.height = Math.round(H * R); GRAIN_PAT = null; MC.clear() }
  }
  addEventListener('resize', fit); fit()
  pp.textContent = playing ? '❚❚' : '▶'
  pp.onclick = () => { manual = false; playing = !playing; pp.textContent = playing ? '❚❚' : '▶' }
  scrub.oninput = () => { manual = false; T = parseFloat(scrub.value) }
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); pp.click() }
    if (e.code === 'ArrowRight') { manual = false; T = Math.min(DUR - 1e-3, T + 1) }
    if (e.code === 'ArrowLeft') { manual = false; T = Math.max(0, T - 1) }
  })
  // 프레임 단위 렌더링(영상 출력용): 루프를 멈추고 지정 시점을 그립니다
  const renderAt = (t) => { manual = true; playing = false; T = t; render(Math.min(t, DUR - 1e-6)) }
  window.__reel = { seek: (t) => { manual = false; T = t; playing = false }, play: () => { manual = false; playing = true }, renderAt, DUR, W, H, vertical: VERT,
    scenes: () => BEATS.map(({ id, t0, t1, label }) => ({ id, t0, t1, name: id, label })), cues: () => [...CUES].sort((a, b) => a.t - b.t) }
  requestAnimationFrame((n) => { last = n; frame(n) })
})()
</script>
</body>
