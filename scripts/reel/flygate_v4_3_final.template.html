<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FlyGate Showreel v4.3</title>
<meta name="description" content="Project-FlyGate 모션 쇼릴 v4.3: STEP 1 FlyDiscovery(시판 전 후보 물질)부터 STEP 2 FlyVigilance(시판 후 허가 약물), NVIDIA Agent Skills, NemoClaw · OpenShell 에이전트, 실제 터미널 캡처로 보는 FlyGate Agent CLI까지" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; color: #eef3ff; }
  #wrap { position: fixed; inset: 0; overflow: hidden; }
  /* 무대(1920×1080)의 가운데를 창 가운데에 맞춘 뒤 창 크기에 맞게 줄입니다 */
  #stage { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; overflow: hidden; background: #04060c; transform-origin: center center; transform: translate(-50%, -50%); }
  #cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  #hud { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; padding: 12px 18px; display: flex; align-items: center; gap: 14px; background: linear-gradient(transparent, rgba(0,0,0,.85)); opacity: 0; transition: opacity .3s; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; color: #9fb0d6; }
  #wrap:hover + #hud, #hud:hover { opacity: 1; }
  #hud button { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  #scrub { flex: 1; accent-color: #37e6ff; }
  #chapters { display: flex; gap: 6px; flex-wrap: wrap; }
  #chapters span { cursor: pointer; padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,.1); }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div></div>
<script>(() => { const f = new URLSearchParams(location.search).get('fmt'), w = f === 'square' || f === 'vertical' ? 1080 : 1920, h = f === 'vertical' ? 1920 : 1080
  for (const id of ['stage', 'cv']) { const e = document.getElementById(id); e.style.width = w + 'px'; e.style.height = h + 'px' } })()</script>
<div id="hud"><button id="pp" type="button">❚❚</button><span id="clock">0:00</span><input id="scrub" type="range" min="0" max="260" step="0.05" value="0" /><div id="chapters"></div></div>
<script>
(() => {
  'use strict'
  // 빌드 스크립트(scripts/build_reel_v4_3.py)가 실측 수치를 여기에 넣습니다
  const D = /*__DATA__*/null
  // 언어: 빌더를 --en 으로 돌리면 D.lang 이 'en' 입니다. 화면에 쓰는 글자는 tr(한국어, 영어)로 고릅니다
  const EN = D.lang === 'en'
  const tr = (ko, en) => (EN ? en : ko)

  // =====================================================================
  //  결정론적 타임라인: 모든 장면은 시간 t 의 순수 함수입니다.
  //  render_reel.py 는 ?paused=1 로 열고 window.__reel.renderAt(t) 로 프레임을 하나씩 그립니다.
  // =====================================================================
  const W = 1920, H = 1080, FPS = 30
  const Q = new URLSearchParams(location.search)
  // 규격: ?fmt=square(1080×1080 · 링크드인 · 인스타그램 피드) · ?fmt=vertical(1080×1920 · 쇼츠 · 릴스 · 틱톡). 기본은 16:9(1920×1080)입니다.
  // 장면은 늘 1920×1080 무대에 그리고, 규격에 맞게 줄여 놓은 뒤 남는 자리에 제목 · 자막 · 용어 풀이를 크게 둡니다
  const FMT = ['square', 'vertical'].includes(Q.get('fmt')) ? Q.get('fmt') : 'wide'
  const OW = FMT === 'wide' ? 1920 : 1080, OH = FMT === 'vertical' ? 1920 : 1080
  const LAYOUT = {
    wide: { k: 0.87, y: 4, subTop: 4 + 1080 * 0.87 + 2, subSize: 44, subSize2: 40, subLH: 50, subMaxW: 1680 },
    square: { k: 0.5625, y: 150, subTop: 150 + 607.5 + 8, subSize: 42, subSize2: 42, subLH: 56, subMaxW: 980 },
    vertical: { k: 0.5625, y: 520, subTop: 520 + 607.5 + 24, subSize: 52, subSize2: 52, subLH: 70, subMaxW: 960 },
  }[FMT]
  const PAUSED = Q.has('paused')
  const cv = document.getElementById('cv'), X = cv.getContext('2d')
  let R = 1

  // ---------- 수학 ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
  const lerp = (a, b, t) => a + (b - a) * t
  const inv = (a, b, x) => clamp((x - a) / (b - a))
  const E = {
    lin: (t) => t, out2: (t) => 1 - (1 - t) * (1 - t), out3: (t) => 1 - Math.pow(1 - t, 3), out5: (t) => 1 - Math.pow(1 - t, 5),
    in3: (t) => t * t * t, inOut3: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    expoOut: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    backOut: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2) },
  }
  const seg = (t, a, b, e = E.out3) => e(inv(a, b, t))
  // a 에 나타나 b 에 사라지는 요소의 불투명도
  const vis = (t, a, b, fin = 0.45, fout = 0.45) => Math.min(seg(t, a, a + fin), 1 - seg(t, b - fout, b, E.inOut3))
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
  const fmtInt = (n) => Math.round(n).toLocaleString('en-US')
  const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' }
  const sup = (n) => String(n).split('').map((c) => SUP[c] ?? c).join('')
  function pSci(p) { const e = Math.floor(Math.log10(p)); let m = +(p / Math.pow(10, e)).toFixed(1); return `p = ${m}×10${sup(e)}` }
  function pText(p) {
    if (p >= 0.001) return `p = ${+p.toFixed(4)}`
    let e = Math.floor(Math.log10(p)), m = Math.round(p / Math.pow(10, e))
    if (m >= 10) { m = 1; e += 1 }
    return `p ≈ ${m}×10${sup(e)}`
  }

  // ---------- 색 · 글꼴 (FlyVigilance web/src/index.css · FlyDiscovery 와 같은 토큰) ----------
  const C = {
    bg: '#04060c', text: '#eef3ff', white: '#f4f7ff', t2: '#a9b6d3', t3: '#6f7d9e', line: 'rgba(120,170,255,0.16)', line2: 'rgba(120,170,255,0.30)',
    cyan: '#37e6ff', blue: '#4d8dff', amber: '#ffb547', magenta: '#ff4fd8', nv: '#76b900', nvl: '#c8f36b', red: '#ff5d6c',
    ok: '#3ddc97', warn: '#ffcc4d', violet: '#a58bff', cream: '#efe8da',
  }
  const SANS = 'system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif'
  const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'

  // ---------- 그리기 도구 ----------
  let GA = 1  // 장면·구간 페이드를 곱해 나가는 전역 불투명도
  const alpha = (a) => { X.globalAlpha = clamp(GA * a) }
  function withA(k, fn) { const g = GA; GA = g * clamp(k); if (GA > 0.002) fn(); GA = g }
  const font = (size, weight = 700, fam = SANS) => { X.font = `${weight} ${size}px ${fam}` }
  const MC = new Map()
  function measure(s, size, weight = 700, fam = SANS, track = 0) {
    const key = `${s}|${size}|${weight}|${fam === MONO ? 'm' : 's'}|${track}`
    let w = MC.get(key)
    if (w === undefined) { X.save(); font(size, weight, fam); X.letterSpacing = track + 'px'; w = X.measureText(s).width; X.restore(); MC.set(key, w) }
    return w
  }
  function text(s, x, y, o = {}) {
    const { size = 32, weight = 700, fam = SANS, color = C.text, a = 1, align = 'left', base = 'alphabetic', track = 0, glow = 0, maxW = 0 } = o
    if (!s || GA * a <= 0.003) return 0
    let sz = size
    if (maxW) { const w0 = measure(s, size, weight, fam, track); if (w0 > maxW) sz = size * maxW / w0 }
    X.save(); font(sz, weight, fam); X.letterSpacing = track + 'px'; X.textAlign = align; X.textBaseline = base; alpha(a); X.fillStyle = color
    if (glow) { X.shadowColor = color; X.shadowBlur = glow }
    X.fillText(s, x, y); const w = X.measureText(s).width; X.restore(); return w
  }
  // 여러 색 조각을 한 줄로: [[문자열, 색, 굵기?], ...]
  function rich(parts, x, y, o = {}) {
    const { size = 32, weight = 700, fam = SANS, a = 1, align = 'left', maxW = 0 } = o
    let sz = size
    const total = () => parts.reduce((s, p) => s + measure(p[0], sz, p[2] ?? weight, fam), 0)
    let tw = total()
    if (maxW && tw > maxW) { sz = size * maxW / tw; tw = total() }
    let cx = align === 'center' ? x - tw / 2 : align === 'right' ? x - tw : x
    for (const p of parts) { text(p[0], cx, y, { size: sz, weight: p[2] ?? weight, fam, color: p[1] ?? C.text, a }); cx += measure(p[0], sz, p[2] ?? weight, fam) }
    return tw
  }
  // 글자별로 마스크 아래에서 솟아오르기 (FDDD 쇼릴의 키네틱 타입)
  function riseParts(parts, x, y, p, o = {}) {
    const { size = 100, weight = 800, stagger = 0.045, dur = 0.5, align = 'left', fam = SANS } = o
    if (p <= 0 || GA <= 0.003) return 0
    const total = parts.reduce((s, q) => s + measure(q[0], size, weight, fam), 0)
    let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x
    X.save(); X.beginPath(); X.rect(cx - 40, y - size * 1.1, total + 80, size * 1.45); X.clip()
    font(size, weight, fam); X.letterSpacing = '0px'; X.textBaseline = 'alphabetic'; X.textAlign = 'left'
    let i = 0
    for (const [str, col] of parts) {
      X.fillStyle = typeof col === 'function' ? col(cx, cx + X.measureText(str).width) : col   // v4.2: 색 자리에 함수(그라디언트)를 받을 수 있습니다
      for (const ch of [...str]) {
        const k = E.expoOut(clamp((p - i * stagger) / dur))
        alpha(clamp(k * 1.4)); X.fillText(ch, cx, y + (1 - k) * size * 1.1)
        cx += X.measureText(ch).width; i++
      }
    }
    X.restore(); return total
  }
  // 모노 타자기
  function typeText(s, x, y, p, o = {}) {
    const full = { fam: MONO, weight: 500, size: 18, color: C.t3, track: 2, ...o }
    const n = Math.floor(clamp(p) * (s.length + 1))
    if (n <= 0) return 0
    const cur = p > 0 && p < 1.1 && Math.floor(p * 24) % 2 === 0 ? '▌' : ''
    let x0 = x
    if (full.align === 'center') { x0 = x - measure(s, full.size, full.weight, full.fam, full.track) / 2 }
    return text(s.slice(0, n) + cur, x0, y, { ...full, align: 'left' })
  }
  // 왼쪽에서 오른쪽으로 닦아 내며 드러내기
  function wipe(p, x, y, w, h, fn) {
    if (p <= 0) return
    X.save(); X.beginPath(); X.rect(x, y, w * clamp(p), h); X.clip(); fn(); X.restore()
  }
  const rr = (x, y, w, h, r) => { X.beginPath(); X.roundRect(x, y, w, h, r) }
  function panel(x, y, w, h, o = {}) {
    const { r = 22, fill = 'rgba(10,16,32,0.78)', stroke = C.line, lw = 1, a = 1, glow = null, top = null } = o
    if (GA * a <= 0.003) return
    X.save(); alpha(a); rr(x, y, w, h, r); X.fillStyle = fill
    if (glow) { X.shadowColor = glow; X.shadowBlur = 50 }
    X.fill(); X.shadowBlur = 0
    if (stroke) { X.strokeStyle = stroke; X.lineWidth = lw; X.stroke() }
    if (top) { X.beginPath(); X.roundRect(x, y, w, 4, [r, r, 0, 0]); X.fillStyle = top; X.fill() }
    X.restore()
  }
  function line(x1, y1, x2, y2, color, a = 1, w = 1, dash = null) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); X.strokeStyle = color; X.lineWidth = w; X.lineCap = 'round'; if (dash) X.setLineDash(dash)
    X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2, y2); X.stroke(); X.restore()
  }
  function dot(x, y, r, color, a = 1, glow = 0) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); X.fillStyle = color; if (glow) { X.shadowColor = color; X.shadowBlur = glow }
    X.beginPath(); X.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); X.fill(); X.restore()
  }
  function ring(x, y, r, color, a = 1, w = 2) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); X.strokeStyle = color; X.lineWidth = w; X.beginPath(); X.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); X.stroke(); X.restore()
  }
  function brackets(x, y, w, h, s = 18, color = '#ffffff', a = 0.5, lw = 1.5) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); X.strokeStyle = color; X.lineWidth = lw; X.beginPath()
    X.moveTo(x, y + s); X.lineTo(x, y); X.lineTo(x + s, y); X.moveTo(x + w - s, y); X.lineTo(x + w, y); X.lineTo(x + w, y + s)
    X.moveTo(x + w, y + h - s); X.lineTo(x + w, y + h); X.lineTo(x + w - s, y + h); X.moveTo(x + s, y + h); X.lineTo(x, y + h); X.lineTo(x, y + h - s)
    X.stroke(); X.restore()
  }
  function arrow(x1, y1, x2, y2, color, a = 1, w = 2, head = 10) {
    if (GA * a <= 0.003) return
    const ang = Math.atan2(y2 - y1, x2 - x1)
    X.save(); alpha(a); X.strokeStyle = color; X.fillStyle = color; X.lineWidth = w; X.lineCap = 'round'
    X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2 - Math.cos(ang) * head * 0.6, y2 - Math.sin(ang) * head * 0.6); X.stroke()
    X.beginPath(); X.moveTo(x2, y2); X.lineTo(x2 - Math.cos(ang - 0.45) * head, y2 - Math.sin(ang - 0.45) * head); X.lineTo(x2 - Math.cos(ang + 0.45) * head, y2 - Math.sin(ang + 0.45) * head); X.closePath(); X.fill()
    X.restore()
  }
  function check(x, y, s, color, a = 1, w = 3) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); X.strokeStyle = color; X.lineWidth = w; X.lineCap = 'round'; X.lineJoin = 'round'
    X.beginPath(); X.moveTo(x - s * 0.5, y); X.lineTo(x - s * 0.12, y + s * 0.38); X.lineTo(x + s * 0.55, y - s * 0.42); X.stroke(); X.restore()
  }
  function cross(x, y, s, color, a = 1, w = 3) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); X.strokeStyle = color; X.lineWidth = w; X.lineCap = 'round'
    X.beginPath(); X.moveTo(x - s / 2, y - s / 2); X.lineTo(x + s / 2, y + s / 2); X.moveTo(x + s / 2, y - s / 2); X.lineTo(x - s / 2, y + s / 2); X.stroke(); X.restore()
  }
  const CHIP = {
    nv: { fg: '#c8f36b', bd: 'rgba(118,185,0,.65)', bg: 'rgba(118,185,0,.13)' }, jev: { fg: '#ffd38a', bd: 'rgba(255,181,71,.65)', bg: 'rgba(255,181,71,.12)' },
    bad: { fg: '#ff9aa3', bd: 'rgba(255,93,108,.65)', bg: 'rgba(255,93,108,.12)' }, ok: { fg: '#6ff0b4', bd: 'rgba(61,220,151,.6)', bg: 'rgba(61,220,151,.12)' },
    cyan: { fg: '#9fefff', bd: 'rgba(55,230,255,.55)', bg: 'rgba(55,230,255,.10)' }, mag: { fg: '#ffa6ec', bd: 'rgba(255,79,216,.55)', bg: 'rgba(255,79,216,.10)' },
    dim: { fg: '#a9b6d3', bd: 'rgba(120,170,255,.24)', bg: 'rgba(10,16,32,.6)' },
  }
  function chipW(label, size = 20, fam = MONO, h = 40) { return measure(label, size, 500, fam) + h * 0.9 }
  function chip(x, y, label, o = {}) {
    const { kind = 'dim', size = 20, h = 40, a = 1, align = 'left', fam = MONO } = o
    const K = CHIP[kind], w = chipW(label, size, fam, h)
    const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x
    if (GA * a <= 0.003) return w
    X.save(); alpha(a); rr(x0, y, w, h, h / 2); X.fillStyle = K.bg; X.fill(); X.strokeStyle = K.bd; X.lineWidth = 1.2; X.stroke(); X.restore()
    text(label, x0 + w / 2, y + h / 2 + 1, { size, weight: 500, fam, color: K.fg, a, align: 'center', base: 'middle' })
    return w
  }
  function bar(x, y, w, h, frac, color, o = {}) {
    const { a = 1, bg = 'rgba(120,170,255,0.10)', glow = 0 } = o
    if (GA * a <= 0.003) return
    X.save(); alpha(a); rr(x, y, w, h, h / 2); X.fillStyle = bg; X.fill()
    if (frac > 0) { rr(x, y, Math.max(h, w * clamp(frac)), h, h / 2); X.fillStyle = color; if (glow) { X.shadowColor = color; X.shadowBlur = glow } X.fill() }
    X.restore()
  }
  // 고무도장: 크게 찍혔다가 제자리로
  function stamp(x, y, label, color, k, o = {}) {
    if (k <= 0 || GA <= 0.003) return
    const { size = 44, rot = -0.14, sub = '' } = o
    const s = lerp(1.9, 1, E.backOut(clamp(k)))
    X.save(); alpha(clamp(k * 2.2)); X.translate(x, y); X.rotate(rot); X.scale(s, s)
    font(size, 900); X.letterSpacing = '4px'
    const tw = X.measureText(label).width, w = tw + size * 0.9, h = size * (sub ? 1.75 : 1.35)
    rr(-w / 2, -h / 2, w, h, 10); X.fillStyle = color + '22'; X.fill(); X.lineWidth = 4; X.strokeStyle = color; X.stroke()
    X.fillStyle = color; X.textAlign = 'center'; X.textBaseline = 'middle'
    X.fillText(label, 0, sub ? -size * 0.18 : 2)
    if (sub) { font(size * 0.34, 700, MONO); X.letterSpacing = '5px'; X.fillText(sub, 0, size * 0.52) }
    X.restore()
  }
  function glowBlob(x, y, r, color, a = 1) {
    if (GA * a <= 0.003) return
    X.save(); alpha(a); const g = X.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)')
    X.fillStyle = g; X.fillRect(x - r, y - r, r * 2, r * 2); X.restore()
  }
  // 오도미터 숫자: 자리마다 굴러가며 멈춥니다 (FDDD 쇼릴에서 가져왔습니다)
  function odometer(value, x, y, o = {}) {
    const { size = 120, weight = 700, color = C.text, align = 'left', sign = '', decimals = 0, final = null, a = 1, fam = SANS, glow = 0 } = o
    if (GA * a <= 0.003) return measure('0', size, weight, fam) * 3
    const v = Math.abs(value)
    const intDigits = Math.max(1, Math.floor(Math.log10(Math.max(1, Math.abs(final ?? value)))) + 1)
    let scaled = v * Math.pow(10, decimals); if (Math.abs(scaled - Math.round(scaled)) < 1e-6) scaled = Math.round(scaled)
    const totalDigits = intDigits + decimals
    X.save(); font(size, weight, fam); X.letterSpacing = '0px'
    const dw = X.measureText('0').width, cw = X.measureText(',').width, pw = X.measureText('.').width, sw = sign ? X.measureText(sign).width : 0
    const cells = []
    for (let k = totalDigits - 1; k >= 0; k--) {
      cells.push({ k }); const intK = k - decimals
      if (intK > 0 && intK % 3 === 0 && decimals === 0) cells.push({ sep: ',' })
      if (k === decimals && decimals > 0) cells.push({ sep: '.' })
    }
    while (cells.length > 1) {
      const c = cells[0]
      if (c.sep === ',') { cells.shift(); continue }
      if (c.sep || c.k <= decimals) break
      if (Math.floor(scaled / Math.pow(10, c.k)) % 10 === 0 && scaled < Math.pow(10, c.k)) { cells.shift(); continue }
      break
    }
    const width = sw + cells.reduce((s, c) => s + (c.sep ? (c.sep === ',' ? cw : pw) : dw), 0)
    let cx = align === 'center' ? x - width / 2 : align === 'right' ? x - width : x
    alpha(a); X.fillStyle = color; X.textBaseline = 'alphabetic'; X.textAlign = 'left'
    if (glow) { X.shadowColor = color; X.shadowBlur = glow }
    X.beginPath(); X.rect(cx - 20, y - size * 0.86, width + 40, size * 1.02); X.clip()
    if (sign) { X.fillText(sign, cx, y); cx += sw }
    for (const c of cells) {

    const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), m = Math.floor(CA3.n * p)
    let prev = null
    X.save(); alpha(a); X.lineWidth = 3; X.lineCap = 'round'
    for (let i = 0; i < m; i++) {
      const px = P[i * 3] - CA3.c[0], py = P[i * 3 + 1] - CA3.c[1], pz = P[i * 3 + 2] - CA3.c[2]
      const x1 = px * cyw + pz * syw, z1 = -px * syw + pz * cyw, y1 = py * cp - z1 * sp, z2 = py * sp + z1 * cp
      const k = 60 / (60 + z2), q = [cx + x1 * s * k, cy - y1 * s * k]

  function wrapLines(s, maxW, size, weight = 500, fam = SANS) {
    const out = []; let cur = ''
    for (const w of String(s).split(' ')) {
      const t = cur ? cur + ' ' + w : w
      if (measure(t, size, weight, fam) <= maxW) { cur = t; continue }
      if (cur) out.push(cur)
      if (measure(w, size, weight, fam) <= maxW) { cur = w; continue }
      cur = ''
      for (const ch of [...w]) { if (measure(cur + ch, size, weight, fam) > maxW) { out.push(cur); cur = ch } else cur += ch }
    }
    if (cur) out.push(cur)
    return out
  }

    playing = false; pp.textContent = '▶'
    const b = document.createElement('button')
    b.textContent = D.lang === 'en' ? '▶ Play with narration' : '▶ 내레이션 켜고 보기'
    b.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;font:700 24px system-ui,sans-serif;padding:18px 34px;border:0;border-radius:40px;background:#76b900;color:#04060c;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.6)'
    b.onclick = () => { b.remove(); AUD.currentTime = T; AUD.play(); playing = true; pp.textContent = '❚❚' }
    document.body.appendChild(b)
    AUD.onended = () => { playing = false; pp.textContent = '▶' }
  }
  function frame(now) {
    const dt = (now - last) / 1000; last = now
    if (!manual) {
      if (AUD && !AUD.paused) T = Math.min(DUR, AUD.currentTime)
      else if (playing && !AUD) T = Math.min(DUR, T + dt)
      // 한 프레임에서 오류가 나도 재생 반복(requestAnimationFrame)이 끊기지 않게 합니다
      try { render(T) } catch (e) { console.error(e) }
      clock.textContent = `${mmss(T)} / ${mmss(DUR)}`; scrub.value = T
      if (T >= DUR && playing) { playing = false; pp.textContent = '▶' }
    }
    requestAnimationFrame(frame)
  }
  const stage = document.getElementById('stage')
  function fit() {
    const k = Math.min(innerWidth / OW, innerHeight / OH)
    stage.style.transform = `translate(-50%, -50%) scale(${k})`
    const r = PAUSED ? 1 : clamp((devicePixelRatio || 1) * k, 1, 2)
    if (Math.abs(r - R) > 0.01 || cv.width !== Math.round(OW * r)) { R = r; cv.width = Math.round(OW * R); cv.height = Math.round(OH * R); GRAIN_PAT = null; MC.clear() }
  }
  addEventListener('resize', fit); fit()
  pp.textContent = playing ? '❚❚' : '▶'
  pp.onclick = () => {
    manual = false; playing = !playing; if (T >= DUR) T = 0; pp.textContent = playing ? '❚❚' : '▶'
    if (AUD) { if (playing) { AUD.currentTime = T; AUD.play() } else AUD.pause() }
  }
  scrub.oninput = () => { manual = false; T = parseFloat(scrub.value); if (AUD) AUD.currentTime = T }
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); pp.click() }
    if (e.code === 'ArrowRight') { manual = false; T = Math.min(DUR, T + 5); if (AUD) AUD.currentTime = T }
    if (e.code === 'ArrowLeft') { manual = false; T = Math.max(0, T - 5); if (AUD) AUD.currentTime = T }
  })
  const ch = document.getElementById('chapters')
  SCENES.forEach((s) => { const sp = document.createElement('span'); sp.textContent = s.name; sp.onclick = () => { manual = false; T = s.t0 + 0.01; if (AUD) AUD.currentTime = T }; ch.appendChild(sp) })
  // 프레임 단위 렌더링(영상 출력용): 루프를 멈추고 지정 시점을 그립니다
  const renderAt = (t) => { manual = true; playing = false; T = t; render(t) }
  window.__reel = { seek: (t) => { manual = false; T = t; playing = false }, play: () => { manual = false; playing = true }, renderAt, DUR,
    scenes: () => SCENES.map(({ id, t0, t1, name, label }) => ({ id, t0, t1, name, label })), cues: () => [...CUES].sort((a, b) => a.t - b.t),
    warps: () => Object.fromEntries(SCENES.map((s) => [s.id, s.warp])) }
  requestAnimationFrame((n) => { last = n; frame(n) })
})()
</script>
</body>
</html>
