  // ---------------- 03 STEP 2 FlyVigilance ----------------
  function sFV(lt) {
    const LY = P3({ tx: 120, ty: 222, al: 'left', ox: 120, oy: 520, oal: 'left', osz: 168, gx: 1010, qx: 1090, qy: 250, qw: 710, qh: 62, qg: 76, mx: 120, my: 820, mal: 'left' },

      // 정사각: 왼쪽에 제목과 보고 수, 오른쪽에 질문 7개, 맨 아래에 지연 시간과 설명을 가로로 놓습니다
      { tx: 70, ty: 200, al: 'left', ox: 70, oy: 520, oal: 'left', osz: 96, gx: 522, qx: 562, qy: 292, qw: 458, qh: 56, qg: 64, mx: 70, my: 880, mal: 'left' })
    typeText(L('STEP 2 · FLYVIGILANCE · 시판 후', 'STEP 2 · FLYVIGILANCE · POST-MARKET'), LY.tx, LY.ty - 76, inv(0.02, 0.4, lt), { size: 22, color: C.magenta, align: LY.al })
    riseParts([['Fly', C.white], ['Vigilance', C.magenta]], LY.tx, LY.ty + 20, (lt - 0.05) * 2.6, { size: P3(104, 108, 88), align: LY.al, glow: 24, stagger: 0.03 })
    // 분기당 FAERS 보고 수
    const c = count(lt, 0.2, 0.85)
    withA(seg(lt, 0.15, 0.3), () => {
      odometer(FV.q_reports * c, LY.ox, LY.oy, { size: LY.osz, final: FV.q_reports, align: LY.oal, color: C.white, glow: 22 })
      text(L(`FAERS 보고 · ${FV.quarter} 한 분기`, `FDA FAERS side-effect reports · ${FV.quarter} alone`), LY.ox, LY.oy + P3(56, 56, 48), { size: P3(30, 32, 26), weight: 700, color: C.t2, align: LY.oal, maxW: SQ ? 440 : 0 })
    })
    // 보고 입자가 게이트를 지나 7개 질문으로 흩어집니다
    const src = VERT ? [CX, LY.oy - 50] : [LY.ox + P3(360, 0, 220), LY.oy - 60]
    const gate = VERT ? [CX, LY.gy] : [LY.gx, P3(520, 0, 510)]
    const gy0 = P3(310, 0, 300), gy1 = P3(730, 0, 720)
    withA(seg(lt, 0.7, 0.9) * (1 - seg(lt, 2.1, 2.4)), () => {
      if (VERT) { line(CX - 160, LY.gy - 12, CX + 160, LY.gy - 12, C.magenta, 0.9, 3, 14); line(CX - 160, LY.gy + 12, CX + 160, LY.gy + 12, C.magenta, 0.9, 3, 14) }
      else { line(LY.gx - 12, gy0, LY.gx - 12, gy1, C.magenta, 0.9, 3, 14); line(LY.gx + 12, gy0, LY.gx + 12, gy1, C.magenta, 0.9, 3, 14) }
      for (let i = 0; i < 70; i++) {
        const st = 0.75 + hash(i) * 0.9, u = (lt - st) / 0.55
        if (u <= 0 || u >= 1) continue
        const qi = i % FV.qs.length
        const tgt = VERT ? [LY.qx + 24, LY.qy + qi * LY.qg + LY.qh / 2] : [LY.qx + 20, LY.qy + qi * LY.qg + LY.qh / 2]
        let x, y
        if (u < 0.5) { const v = E.in3(u * 2); x = lerp(src[0] + (hash(i + 9) - 0.5) * 160, gate[0], v); y = lerp(src[1] + (hash(i + 7) - 0.5) * 60, gate[1], v) }
        else { const v = E.out3((u - 0.5) * 2); x = lerp(gate[0], tgt[0], v); y = lerp(gate[1], tgt[1], v) }
        dot(x, y, 3.2, i % 3 ? C.magenta : C.white, 1 - Math.abs(u - 0.5) * 0.6, 12)
      }
    })
    // 사례 하나에 묻는 7개 질문(타입이 있는 판단)
    FV.qs.forEach(([name, type], i) => {
      const t0 = 0.95 + i * 0.08, y = LY.qy + i * LY.qg, a = seg(lt, t0, t0 + 0.2)
      if (a <= 0) return
      X.save(); X.translate((1 - E.out3(a)) * 50, 0)
      withA(a, () => {
        panel(LY.qx, y, LY.qw, LY.qh, { r: 14, stroke: 'rgba(255,79,216,.40)' })
        text(`Q${i + 1}`, LY.qx + 22, y + LY.qh / 2 + 9, { size: 22, weight: 800, fam: MONO, color: C.magenta })
        text(name, LY.qx + 84, y + LY.qh / 2 + 10, { size: P3(28, 30, 26), weight: 800, color: C.white, maxW: SQ ? LY.qw - 118 - chipW(type, 18, SANS, 36) : LY.qw - 300 })
        chip(LY.qx + LY.qw - 18, y + (LY.qh - 36) / 2, type, { kind: 'mag', size: 18, h: 36, align: 'right', fam: SANS })
      })
      X.restore()
    })
    // 한 번의 호출로 7개 질문에 답합니다: 판단 지연 중앙값
    const mk = seg(lt, 1.6, 1.85, E.expoOut)
    if (lt > 1.6) {
      const s = lerp(1.5, 1, mk)
      X.save(); X.translate(LY.mx, LY.my); X.scale(s, s)
      const w = rich([[String(FV.p50), C.nvl, 900], [' ms', C.nvl, 700]], 0, 0, { size: P3(150, 140, 120), align: LY.mal, a: clamp(mk * 1.6), glow: 30 })
      X.restore()
      // 정사각판은 설명 두 줄을 숫자 오른쪽에 둡니다
      const cx2 = SQ ? LY.mx + w + 36 : LY.mx, cy2 = SQ ? LY.my - 94 : LY.my, cw2 = SQ ? W - 60 - cx2 : VERT ? 940 : 820
      withA(seg(lt, 1.75, 2.0), () => {
        text(L(`질문 ${FV.qs.length}개를 한 번에 판단합니다 · 지연 중앙값`, `All ${FV.qs.length} questions in one pass · median latency`), cx2, cy2 + 52, { size: P3(28, 30, 26), weight: 700, color: C.white, align: LY.mal, maxW: cw2 })
        text(L('비자기회귀 판단 모델 + NVIDIA Nemotron', 'Non-autoregressive judgment model + NVIDIA Nemotron'), cx2, cy2 + 94, { size: P3(24, 26, 22), weight: 600, fam: MONO, color: C.nvl, align: LY.mal, maxW: cw2 })
      })
    }
  }

  function sWork(lt) {
    const y0 = P3(230, 560, 200)
    riseParts(L([['사람이 ', C.white], ['먼저', C.amber], [' 볼 사례', C.white]], [['Cases ', C.white], ['escalated', C.amber], [' to a human', C.white]]), CX, y0, (lt - 0.02) * 3, { size: P3(72, 72, 64), align: 'center', stagger: 0.02, maxW: W - 140 })

    // 302 → 138
    const bs = P3(210, 160, 150), by = P3(505, 850, 440)
    const wa = odoW(BL.base_human, bs), wr = measure(' → ', bs * 0.7, 800), wb = odoW(BL.base_human, bs)
    const x0 = CX - (wa + wr + wb) / 2
    withA(seg(lt, 0.05, 0.15), () => {
      text(String(BL.base_human), x0, by, { size: bs, weight: 800, color: '#7c89a8' })
      const sk = seg(lt, 0.35, 0.55)
      if (sk > 0) line(x0 - 8, by - bs * 0.34, x0 - 8 + (wa + 16) * sk, by - bs * 0.34, C.red, 0.9, 8)
      text(' → ', x0 + wa, by - bs * 0.1, { size: bs * 0.7, weight: 800, color: C.t2 })
      const c = count(lt, 0.3, 0.6)
      odometer(lerp(BL.base_human, BL.fv_human, c), x0 + wa + wr, by, { size: bs, final: BL.base_human, color: C.cyan, glow: 36 })
    })
    // 점 격자: 302개 중 138개만 남습니다
    const cols = P3(38, 26, 34), sp = P3(24, 32, 26), gw = (cols - 1) * sp, gx = CX - gw / 2, gy = P3(604, 960, 520)
    const drop = seg(lt, 0.35, 0.85, E.inOut3)
    X.save(); X.globalCompositeOperation = 'lighter'
    for (let i = 0; i < BL.base_human; i++) {

      rich([[L('과잉 호출 ', 'Unneeded escalations '), C.t2, 700], [`${BL.base_over} → ${BL.fv_over}`, C.white, 900], ['   ·   ', C.t3, 400], [pText(BL.p_work), C.nvl, 700]], CX, y, { size: VERT ? 34 : 32, align: 'center', maxW: W - 140 })

      { gx: 290, gy: 624, r: 180, tx: CX, ty: 210, al: 'center', bx: 560, bw: 460, ry: 580, tw: 940 })

    for (let k = 0; k < 40; k++) { const an = -Math.PI / 2 + (k / 40) * Math.PI * 2; line(LY.gx + Math.cos(an) * (LY.r + 26), LY.gy + Math.sin(an) * (LY.r + 26), LY.gx + Math.cos(an) * (LY.r + 36), LY.gy + Math.sin(an) * (LY.r + 36), '#ffffff', 0.18, 2) }

    riseParts(L([['지식 기반 ', C.white], ['판별', C.magenta]], [['Knowledge-based ', C.white], ['detection', C.magenta]]), LY.tx, LY.ty + 30, (lt - 0.08) * 3, { size: P3(84, 80, 72), align: LY.al, stagger: 0.02, glow: 16, maxW: LY.tw })
    text(L('약과 반응 이름으로 알려진 이상반응을 가려냅니다', 'Flags known side effects from drug and reaction names alone'), LY.tx, LY.ty + 86, { size: VERT ? 30 : 28, weight: 600, color: C.t2, align: LY.al, a: seg(lt, 0.25, 0.45), maxW: VERT || SQ ? 940 : 800 })
    const rows = [[L('FlyGate · 지식 기반', 'FlyGate · knowledge-based'), AU.kb, C.magenta], [L(`통계 지표 최고 · ${AU.best_name}`, `Best classic statistic · ${AU.best_name}`), AU.best, '#7c89a8']]

    }))
  }
  { const t = B0.auc; cue(t, 'hit', { g: 1 }); cue(t, 'glitch', { d: 0.08 }); cue(t + 0.1, 'sweep', { d: 0.7 }); cue(t + 0.1, 'count', { d: 0.7 }); cue(t + 0.8, 'lock', { f: 1.4 }) }

  // ---------------- 07 NVIDIA 스택 ----------------
  const TILES = [
    { title: 'NVIDIA Nemotron', big: `${GD.caught}/${GD.n}`, sub: L(['근거를 넘는 주장 차단', 'PV 정책 가드 · 숙의 · 리랭커'], ['Overreaching claims caught', 'Policy guard · debate · reranker']) },
    { title: 'BioNeMo NIM', big: '4', unit: L('단계', 'steps'), sub: ['MSA-Search → OpenFold3', '→ DiffDock → Boltz-2'] },
    { title: 'NVIDIA Agent Skills', big: String(AG.skills), unit: L('개', ''), sub: L(['에이전트 스킬', '시판 전 · 시판 후 전 과정'], ['Agent skills', 'Pre-market to post-market']) },
    { title: 'NemoClaw · OpenShell', big: `${AG.smoke_pass}/${AG.smoke_total}`, sub: L(['샌드박스 스모크 통과', '허용 목록 밖 네트워크 차단'], ['Sandbox smoke tests passed', 'Network locked to an allowlist']) },
  ]
  function sStack(lt) {
    const hy = P3(214, 400, 180), hs = SQ ? 60 : 76, hg = SQ ? 76 : 96
    if (VERT || SQ) {
      riseParts(L([['NVIDIA 스킬', C.nvl], [' 위에 쌓은', C.white]], [['An agentic workflow', C.white]]), CX, hy, (lt - 0.02) * 3, { size: hs, align: 'center', stagger: 0.02, glow: 14 })
      riseParts(L([['에이전트 워크플로', C.white]], [['built on ', C.white], ['NVIDIA Skills', C.nvl]]), CX, hy + hg, (lt - 0.12) * 3, { size: hs, align: 'center', stagger: 0.02 })
    } else {
      riseParts(L([['NVIDIA 스킬', C.nvl], [' 위에 쌓은 에이전트 워크플로', C.white]], [['An agentic workflow built on ', C.white], ['NVIDIA Skills', C.nvl]]), CX, hy, (lt - 0.02) * 3, { size: 72, align: 'center', stagger: 0.015, glow: 14, maxW: W - 140 })
    }
    text(L('비자기회귀 판단 모델과 NVIDIA Nemotron이 함께 판단합니다', 'Pairing NVIDIA Nemotron with a non-autoregressive judgment model'), CX, hy + P3(66, 170, 134), { size: VERT ? 32 : 30, weight: 600, color: C.t2, align: 'center', a: seg(lt, 0.2, 0.4), maxW: W - 140 })
    // 정사각판은 세로판처럼 2×2 로 놓되 타일 높이를 줄입니다
    const tw = VERT || SQ ? 460 : 404, th = P3(390, 400, 280), gap = P3(24, 28, 20)
    const tT = P3(64, 64, 56), tB = P3(0.6, 0.6, 0.54), tS = P3(78, 78, 64), tJ = SQ ? 30 : 36
    TILES.forEach((tl, i) => {
      const col = VERT || SQ ? i % 2 : i, row = VERT || SQ ? Math.floor(i / 2) : 0, n = VERT || SQ ? 2 : 4
      const x = CX - (n * tw + (n - 1) * gap) / 2 + col * (tw + gap), y = P3(350, 700, 346) + row * (th + gap)
      const t0 = 0.25 + i * 0.13, k = seg(lt, t0, t0 + 0.25, E.expoOut)
      if (k <= 0) return
      X.save(); X.translate(x + tw / 2, y + th / 2); const s = lerp(1.25, 1, k); X.scale(s, s); X.translate(-(x + tw / 2), -(y + th / 2))
      withA(clamp(k * 1.6), () => {
        panel(x, y, tw, th, { r: 22, top: C.nv, stroke: 'rgba(118,185,0,.45)', lw: 1.5, glow: 'rgba(118,185,0,.25)' })
        text(tl.title, x + 32, y + tT, { size: P3(30, 32, 30), weight: 800, color: C.white, maxW: tw - 64 })
        const bw = text(tl.big, x + 32, y + th * tB, { size: P3(120, 124, 96), weight: 900, color: C.nvl, glow: 26 })
        if (tl.unit) text(tl.unit, x + 40 + bw, y + th * tB, { size: SQ ? 30 : 34, weight: 800, color: C.nvl })
        tl.sub.forEach((ln, j) => text(ln, x + 32, y + th - tS + j * tJ, { size: j ? 21 : 25, weight: j ? 600 : 800, color: j ? C.t2 : C.white, fam: j ? MONO : SANS, maxW: tw - 64 }))
      })
      X.restore()
    })
  }
  { const t = B0.stack; cue(t, 'hit', { g: 1 }); cue(t, 'glitch', { d: 0.08 }); TILES.forEach((_, i) => cue(t + 0.25 + i * 0.13, 'slam', { g: 0.7 + i * 0.1 }))
    cue(t + 0.9, 'riser', { d: 0.6, up: 1 }) }

  // ---------------- 08 마무리: 뇌 → FlyGate ----------------
  function endCard(lt, poster = false) {
    const bs = P3(470, 400, 350), by = VERT || SQ ? LOGO.y - 70 : LOGO.y - 90
    const m = poster ? 1 : seg(lt, 0.12, 1.1, E.lin)
    cloud(lt + 3, CX, by, bs, poster ? 0.5 : 1, m, { spin: poster ? 0 : 0.4, yaw0: 0.1 })
    const solid = poster ? 1 : seg(lt, 0.9, 1.25)
    glowBlob(CX, LOGO.y - LOGO.size * 0.35, LOGO.size * 2.2, 'rgba(55,230,255,0.12)', solid)
    logoText(solid, 40)
    const t1 = poster ? 1 : seg(lt, 1.05, 1.3), t2 = poster ? 1 : seg(lt, 1.15, 1.4), t3 = poster ? 1 : seg(lt, 1.25, 1.5)
    const y1 = LOGO.y + P3(96, 110, 92)
    if (VERT || SQ) {
      // 슬로건: 분자에서 환자까지, 추론보다 근거가 먼저. FlyGate. (FlyGate 는 위 로고)
      const ss = SQ ? 44 : 50, sg = SQ ? 60 : 70
      text(L('분자에서 환자까지,', 'From molecule to patient,'), CX, y1, { size: ss, weight: 800, color: C.white, align: 'center', a: t1, maxW: W - 140 })
      rich(L([['추론보다 ', C.t2, 800], ['근거가 먼저.', C.cyan, 800]], [['evidence ', C.cyan, 800], ['before inference.', C.t2, 800]]), CX, y1 + sg, { size: ss, align: 'center', a: t1, maxW: W - 140 })
    } else {
      rich(L([['분자에서 환자까지, ', C.white, 800], ['추론보다 ', C.t2, 800], ['근거가 먼저.', C.cyan, 800]], [['From molecule to patient, ', C.white, 800], ['evidence ', C.cyan, 800], ['before inference.', C.t2, 800]]), CX, y1, { size: 48, align: 'center', a: t1 })
    }
    const y2 = y1 + P3(84, 190, 144)
    text(D.meta.hack.toUpperCase(), CX, y2, { size: P3(24, 25, 22), weight: 700, fam: MONO, color: C.nvl, align: 'center', track: VERT || SQ ? 3 : 5, a: t2, maxW: W - 120 })
    const url = D.meta.live.replace(/^https?:\/\//, '')
    const ch = P3(66, 70, 62), cs = P3(32, 34, 30), cg = SQ ? 34 : 40
    withA(t3, () => {
      const cw = chipW(url, cs, MONO, ch)
      panel(CX - cw / 2, y2 + cg, cw, ch, { r: 35, fill: 'rgba(55,230,255,0.10)', stroke: 'rgba(55,230,255,0.7)', lw: 2, glow: 'rgba(55,230,255,0.35)' })
      text(url, CX, y2 + cg + ch / 2 + 1, { size: cs, weight: 700, fam: MONO, color: C.white, align: 'center', base: 'middle' })
    })
    const cr = 'NVIDIA NIM (BioNeMo · Nemotron) · NVIDIA Agent Skills · NemoClaw · OpenShell · FDA FAERS · MaleCNS v1.0 (Janelia FlyEM, CC BY 4.0)'
    const ca = poster ? 0.8 : seg(lt, 1.4, 1.7) * 0.8
    if (VERT || SQ) {
      const cy = SQ ? H - 156 : H - 190
      text('NVIDIA NIM (BioNeMo · Nemotron) · NVIDIA Agent Skills · NemoClaw · OpenShell', CX, cy, { size: 16, weight: 500, fam: MONO, color: C.t3, align: 'center', a: ca, maxW: W - 140 })
      text('FDA FAERS · MaleCNS v1.0 (Janelia FlyEM, CC BY 4.0)', CX, cy + 26, { size: 16, weight: 500, fam: MONO, color: C.t3, align: 'center', a: ca, maxW: W - 140 })
    } else text(cr, CX, H - 132, { size: 15, weight: 500, fam: MONO, color: C.t3, align: 'center', a: ca, maxW: W - 200 })
  }
  function sEnd(lt) { endCard(lt) }
  { const t = B0.end; cue(t, 'boom', { g: 1.1, big: 1 }); cue(t, 'whoosh', { d: 1.1 }); cue(t + 0.9, 'lock', { big: 1 }); cue(t + 0.95, 'tail', { d: 1.0 }); cue(t + 1.25, 'tick', { f: 1.6 }) }

  const DRAW = { poster: sPoster, hook: sHook, disc: sDisc, fv: sFV, serious: sSerious, work: sWork, auc: sAUC, stack: sStack, end: sEnd }

  // ---------- 공통 HUD (FDDD 쇼릴의 프레임 언어) ----------
  function hud(T, b) {
    const g = GA; GA = 1
    brackets(M, M, W - M * 2, H - M * 2, 22, '#ffffff', 0.3, 1.5)
    const bw = text('PROJECT-FLYGATE', M + 30, M + 34, { size: 15, weight: 700, fam: MONO, color: C.cream, track: 4 })
    text('/  TEASER 15s', M + 30 + bw + 12, M + 34, { size: 15, weight: 500, fam: MONO, color: C.t3, track: 2 })
    const f = Math.floor(T * FPS + 1e-6), ss = Math.floor(f / FPS), ff = f % FPS
    text(`TC 00:00:${String(ss).padStart(2, '0')}:${String(ff).padStart(2, '0')}`, W - M - 30, M + 34, { size: 15, weight: 500, fam: MONO, color: C.t3, align: 'right', track: 2 })
    const step = b.id === 'disc' ? 1 : ['fv', 'serious', 'work', 'auc'].includes(b.id) ? 2 : 0
    if (!VERT && !SQ) {
      let px = W - M - 260
      for (const [l, n] of [[L('STEP 2 · 시판 후', 'STEP 2 · POST-MARKET'), 2], [L('STEP 1 · 시판 전', 'STEP 1 · PRE-MARKET'), 1]]) {
        const w = chipW(l, 13, MONO, 26); px -= w
        chip(px, M + 13, l, { kind: step === n ? (n === 1 ? 'cyan' : 'mag') : 'dim', size: 13, h: 26, a: step === n ? 1 : 0.5 }); px -= 10
      }
    }
    text(`${NUM[b.id]} — ${b.label}`, M + 30, H - M - 20, { size: 15, weight: 500, fam: MONO, color: C.cream, track: 2, maxW: W * 0.55 })
    text(`${W}×${H} · 30FPS · ${L('실측 데이터', 'MEASURED DATA')}`, W - M - 30, H - M - 20, { size: 14, weight: 500, fam: MONO, color: C.t3, align: 'right', track: 1 })
    const x0 = M + 30, x1 = W - M - 30, y = H - M - 46
    line(x0, y, x1, y, '#ffffff', 0.12, 1); line(x0, y, lerp(x0, x1, T / DUR), y, C.cyan, 0.9, 2)
    for (const s of BEATS.slice(1)) line(lerp(x0, x1, s.t0 / DUR), y - 4, lerp(x0, x1, s.t0 / DUR), y + 4, '#ffffff', 0.35, 1)
    GA = g
  }

  // ---------- 컷 효과: 글리치(RGB 분리 + 띠 밀림)와 섬광 ----------
  const GB = [0, 1, 2].map(() => document.createElement('canvas'))
  function glitchPost(k, seed) {
    const cw = cv.width, ch = cv.height
    for (const c of GB) if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch }
    const [org, rc, gbc] = GB.map((c) => c.getContext('2d'))
    org.globalCompositeOperation = 'copy'; org.drawImage(cv, 0, 0)
    for (const [g, col] of [[rc, '#ff0000'], [gbc, '#00ffff']]) {
      g.globalCompositeOperation = 'copy'; g.drawImage(cv, 0, 0)
      g.globalCompositeOperation = 'multiply'; g.fillStyle = col; g.fillRect(0, 0, cw, ch)
    }
    const dx = Math.round(k * 16 * R)
    X.save(); X.setTransform(1, 0, 0, 1, 0, 0)
    X.globalAlpha = 1; X.globalCompositeOperation = 'copy'; X.drawImage(GB[1], dx, 0)
    X.globalCompositeOperation = 'lighter'; X.drawImage(GB[2], -dx, 0)
    X.globalCompositeOperation = 'source-over'
    const n = 3 + Math.floor(k * 7)
    for (let i = 0; i < n; i++) {
      const y = Math.floor(hash(seed * 13.1 + i) * ch), h = Math.floor((0.01 + hash(seed * 7.7 + i) * 0.06) * ch), sh = Math.round((hash(seed * 3.3 + i) - 0.5) * k * 180 * R)
      X.drawImage(GB[0], 0, y, cw, h, sh, y, cw, h)
    }
    X.restore()
  }

  function render(T) {
    X.setTransform(R, 0, 0, R, 0, 0)
    X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; X.shadowBlur = 0
    X.drawImage(BG, 0, 0, W, H)
    const b = BEATS.find((s) => T >= s.t0 && T < s.t1) ?? BEATS[BEATS.length - 1]
    const lt = T - b.t0
    // 컷마다 살짝 당겨졌다가 제자리로 돌아오는 줌 펀치
    const z = b.id === 'poster' ? 1 : 1 + 0.045 * (1 - E.out3(clamp(lt / 0.4)))
    GA = 1; X.save(); X.translate(W / 2, H / 2); X.scale(z, z); X.translate(-W / 2, -H / 2)
    DRAW[b.id](lt, T)
    X.restore(); GA = 1
    hud(T, b)
    // 컷 직후 섬광
    if (b.id !== 'poster' && lt < 0.1) { X.save(); X.globalAlpha = 0.14 * (1 - lt / 0.1); X.fillStyle = '#ffffff'; X.fillRect(0, 0, W, H); X.restore() }
    // 필름 그레인
    if (!GRAIN_PAT) GRAIN_PAT = X.createPattern(GRAIN, 'repeat')
    const f = Math.floor(T * FPS)
    X.save(); X.globalAlpha = 0.035; X.globalCompositeOperation = 'overlay'; X.translate(-(hash(f) * 256) | 0, -(hash(f + 0.5) * 256) | 0)
    X.fillStyle = GRAIN_PAT; X.fillRect(0, 0, W + 256, H + 256); X.restore()
    // 컷 앞뒤 두세 프레임에 글리치
    for (const s of BEATS.slice(1)) {
      const d = T - s.t0
      if (d > -0.07 && d < 0.1) { glitchPost(d < 0 ? 1 + d / 0.07 * 0.5 : 1 - d / 0.1, Math.floor(T * FPS)); break }
    }
  }

  // ---------- 재생기 ----------
  let T = 0, playing = !PAUSED, last = performance.now(), manual = false
  if (Q.get('t')) T = parseFloat(Q.get('t'))
  const clock = document.getElementById('clock'), scrub = document.getElementById('scrub'), pp = document.getElementById('pp')
  scrub.max = DUR
  function frame(now) {
    const dt = (now - last) / 1000; last = now
    if (!manual) {
      if (playing) { T += dt; if (T >= DUR) T = Q.has('once') ? DUR - 1e-3 : T - DUR }   // 소셜 피드처럼 반복 재생합니다
      render(T)
      clock.textContent = `${T.toFixed(1)} / ${DUR.toFixed(1)}`; scrub.value = T
    }
    requestAnimationFrame(frame)
  }
  function fit() {
    const k = Math.min(innerWidth / W, innerHeight / H)
    stage.style.transform = `translate(-50%, -50%) scale(${k})`
    const r = PAUSED ? 1 : clamp((devicePixelRatio || 1) * k, 1, 2)
    if (Math.abs(r - R) > 0.01 || cv.width !== Math.round(W * r)) { R = r; cv.width = Math.round(W * R); cv.height = Math.round(H * R); GRAIN_PAT = null; MC.clear() }
  }
  addEventListener('resize', fit); fit()
  pp.textContent = playing ? '❚❚' : '▶'
  pp.onclick = () => { manual = false; playing = !playing; pp.textContent = playing ? '❚❚' : '▶' }
  scrub.oninput = () => { manual = false; T = parseFloat(scrub.value) }
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); pp.click() }
    if (e.code === 'ArrowRight') { manual = false; T = Math.min(DUR - 1e-3, T + 1) }
    if (e.code === 'ArrowLeft') { manual = false; T = Math.max(0, T - 1) }
  })
  // 프레임 단위 렌더링(영상 출력용): 루프를 멈추고 지정 시점을 그립니다
  const renderAt = (t) => { manual = true; playing = false; T = t; render(Math.min(t, DUR - 1e-6)) }
  window.__reel = { seek: (t) => { manual = false; T = t; playing = false }, play: () => { manual = false; playing = true }, renderAt, DUR, W, H, vertical: VERT, square: SQ, lang: EN ? 'en' : 'ko',
    scenes: () => BEATS.map(({ id, t0, t1, label }) => ({ id, t0, t1, name: id, label })), cues: () => [...CUES].sort((a, b) => a.t - b.t) }
  requestAnimationFrame((n) => { last = n; frame(n) })
})()
</script>
</body>
