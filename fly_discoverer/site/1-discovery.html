<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyGate — 1 · 시판 전 탐색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* 색·컴포넌트 토큰은 FDDD(fly-connectome-template) src/style.css 에서 가져옴.
   글자 크기만 가독성을 위해 상향. 크레딧은 각 화면 푸터에 표시. */
:root{
--bg:#060B13; --panel:#080F1A; --panel2:#0B1421; --panel3:#101B2B;
--line:#1D2B3D; --line2:#2B3D53; --line3:#25405E;
--text:#DCE8F4; --bright:#EDF6FF; --muted:#8093AC; --muted2:#92A8BE;
--accent:#65D9F1; --ok:#70F2B8; --warn:#FFC445; --no:#FF8B35; --human:#B76CFF; --ligand:#DDBB65;
--r:7px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'DM Sans','IBM Plex Sans KR',system-ui,sans-serif;color:var(--text);font-size:15px;line-height:1.5;font-synthesis:none}
a{color:#9DC7E2;text-decoration:none}a:hover{color:#FFFFFF}
button{font:inherit;color:var(--text);background:#101C2B;border:1px solid var(--line2);border-radius:5px;cursor:pointer}
button:hover{border-color:#78B7DC;color:#FFFFFF}
button:focus-visible{outline:2px solid #4EE4FF;outline-offset:4px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.13em;color:#7392AE;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r)}
.h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.2px;color:var(--bright)}
.trow{background:transparent;border-radius:0}
.trow:hover{background:#17263A;border-color:transparent}
.foot{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#516A83}
.foot a{color:#779AB7}
@keyframes fadeA{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes fadeB{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.live{animation:pulse 2s ease-in-out infinite}
.bar{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.grow{animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* 스탠드얼론 전용 보정: 좁은 화면에서 오른쪽이 잘리지 않게 한다 */
body{overflow-x:hidden}
#app>div{margin:0 auto}
</style>
</head>
<body>
<template id="tpl">
<div style="width: 100%; max-width: 1440px; min-height: 1830px; height: auto; display: flex; flex-direction: column; background: var(--bg);">

<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--line); background: #080E17;">
<div style="display: flex; align-items: baseline; gap: 16px;">
<span style="font-size: 22px; font-weight: 600; letter-spacing: 5px;">FLYGATE</span>
<span style="font-size: 14px; color: var(--muted2);">Discovery 워크벤치</span>
<span class="mono" style="font-size: 12px; letter-spacing: .1em; color: var(--accent); border: 1px solid #23485C; border-radius: 4px; padding: 4px 10px;">STEP 1 / 2 · 시판 전 탐색</span>
</div>
<span class="mono" style="font-size: 13px; color: var(--muted);">4R6E · 2P16 · 3LN1</span>
</header>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 24px 32px 28px;">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<span class="lbl">후보 검토 · {{ tgt.full }}</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.5px;">{{ tgt.label }} × {{ sel.name }}</h1>
</div>
<div role="group" aria-label="타깃 선택" style="display: flex; gap: 8px;">
<sc-for list="{{ targets }}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{ t.pick }}" style="height: 46px; padding: 0 20px; border-radius: var(--r); cursor: pointer; font-size: 15px; font-weight: 600; border: 1px solid {{ t.bd }}; background: {{ t.bg }}; color: {{ t.fg }};">{{ t.label }}</button>
</sc-for>
</div>
</div>

<div class="card" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); overflow: hidden;">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="6">
<div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line);">
<span class="lbl" style="font-size: 11px;">{{ s.no }}</span>
<span style="font-size: 15px; font-weight: 600;">{{ s.name }}</span>
<span style="display: flex; align-items: center; gap: 7px; font-size: 13px; color: {{ s.c }};"><span class="live" style="width: 7px; height: 7px; border-radius: 50%; background: {{ s.c }}; opacity: {{ s.dot }};"></span>{{ s.status }}</span>
<span class="mono" style="font-size: 12px; color: var(--muted);">{{ s.tool }}</span>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 20px; flex-grow: 1; min-height: 0;">

<div style="display: flex; flex-direction: column; gap: 20px; min-width: 0;">

<section class="card" style="overflow: hidden;">
<div style="display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--line);">
<h2 class="h2">후보 비교</h2>
<span style="font-size: 13px; color: var(--muted2);">{{ tgt.label }} 안에서만 순위를 매깁니다</span>
</div>
<div class="lbl" style="display: grid; grid-template-columns: 1.5fr 1.4fr 1.5fr 1fr 1.1fr 1.1fr; gap: 16px; padding: 12px 20px; font-size: 11px; border-bottom: 1px solid var(--line);">
<span>후보</span><span>역할</span><span>Vina kcal/mol</span><span>DiffDock</span><span>Boltz-2 pIC50</span><span>ChEMBL 실측</span>
</div>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
<button type="button" class="trow" onClick="{{ r.pick }}" style="display: grid; grid-template-columns: 1.5fr 1.4fr 1.5fr 1fr 1.1fr 1.1fr; gap: 16px; align-items: center; width: 100%; min-height: 60px; padding: 12px 20px; text-align: left; cursor: pointer; border: 0; border-bottom: 1px solid var(--line); border-left: 3px solid {{ r.edge }}; color: var(--text); background: {{ r.bg }}; transition: background .2s; animation: fade{{ ab }} .35s ease both; animation-delay: {{ r.d }};">
<span style="display: flex; align-items: baseline; gap: 10px;"><span class="mono" style="font-size: 13px; color: var(--muted); width: 14px;">{{ r.rank }}</span><span style="font-size: 16px; font-weight: 600;">{{ r.name }}</span></span>
<span style="font-size: 13px; color: {{ r.roleC }};">{{ r.role }}</span>
<span style="display: flex; align-items: center; gap: 12px;"><span class="mono" style="font-size: 15px; width: 60px;">{{ r.score }}</span><span style="display: block; flex-grow: 1; height: 6px; border-radius: 3px; background: #1B2B3E;"><span class="bar" style="display: block; height: 6px; border-radius: 3px; width: {{ r.bar }}; background: {{ r.barC }};"></span></span></span>
<span class="mono" style="font-size: 14px; color: {{ r.ddC }};">{{ r.dd }}</span>
<span style="display: flex; align-items: baseline; gap: 8px;"><span class="mono" style="font-size: 15px;">{{ r.bz }}</span><span class="mono" style="font-size: 12px; color: {{ r.pbC }};">{{ r.pb }}</span></span>
<span class="mono" style="font-size: 14px; color: {{ r.chC }};">{{ r.ch }}</span>
</button>
</sc-for>
<p style="margin: 0; padding: 14px 20px; font-size: 13px; line-height: 1.6; color: var(--muted2);">{{ tgt.note }}</p>
</section>

<section class="card" style="overflow: hidden;">
<div style="display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--line);">
<h2 class="h2">주장 검증</h2>
<span style="font-size: 13px; color: var(--muted2);">1단 근거 ID · 2단 숫자 대조 · 3단 추론</span>
<span class="mono" style="margin-left: auto; font-size: 12px; color: var(--muted);">Nemotron 3 Super 120B</span>
</div>
<sc-for list="{{ claims }}" as="c" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 108px; gap: 20px; align-items: start; padding: 18px 20px; border-bottom: 1px solid var(--line); animation: fade{{ ab }} .4s ease both; animation-delay: {{ c.d0 }};">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0;">
<span style="font-size: 15px; line-height: 1.55;">{{ c.text }}</span>
<span style="font-size: 13px; line-height: 1.6; color: var(--muted2);">{{ c.reason }}</span>
<span class="mono" style="font-size: 12px; color: var(--muted);">{{ c.ev }}</span>
</div>
<span class="mono" style="font-size: 13px; font-weight: 600; letter-spacing: .06em; text-align: center; padding: 8px 0; border-radius: 6px; color: {{ c.vc }}; background: {{ c.vb }};">{{ c.verdict }}</span>
</div>
</sc-for>
</section>
</div>

<div style="display: flex; flex-direction: column; gap: 20px; min-width: 0;">

<section class="card" style="overflow: hidden;">
<div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line);">
<h2 class="h2">결합 포즈</h2>
<span class="mono" style="margin-left: auto; font-size: 12px; color: var(--muted);">{{ tgt.pdb }} · mode 1</span>
</div>
<canvas ref="{{ structRef }}" aria-label="선택한 수용체 원자와 도킹 포즈" style="width: 100%; height: 300px; display: block; background: #070D17;"></canvas>
<div style="display: flex; align-items: center; gap: 18px; padding: 14px 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted2);">
<span style="display: flex; align-items: center; gap: 8px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{ tgt.c }};"></span>수용체</span>
<span style="display: flex; align-items: center; gap: 8px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #DDBB65;"></span>{{ sel.name }} 포즈</span>
</div>
</section>

<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">
<h2 class="h2">시판 후 근거</h2>
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line);"><span style="font-size: 14px; color: var(--muted2);">허가 라벨 · DailyMed</span><span style="font-size: 15px; text-align: right;">{{ hum.label }}</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line);"><span style="font-size: 14px; color: var(--muted2);">이상사례 · FAERS</span><span class="mono" style="font-size: 15px;">{{ hum.faers }}</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px;"><span style="font-size: 14px; color: var(--muted2);">문헌 · PubMed</span><span class="mono" style="font-size: 15px; color: var(--muted);">미조회</span></div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 4px; padding: 12px 14px; border: 1px dashed var(--line2); border-radius: var(--r);"><span class="mono" style="font-size: 12px; color: var(--accent);">STEP 2 →</span><span style="font-size: 13px; line-height: 1.55; color: var(--muted2);">이 후보의 시판 후 이상사례는 2단계 콘솔에서 보고 단위로 평가합니다</span></div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.65; color: var(--muted2);">{{ hum.note }}</p>
</section>

<section class="card" style="display: grid; grid-template-columns: 150px minmax(0, 1fr); overflow: hidden; flex-grow: 1;">
<canvas ref="{{ brainRef }}" aria-label="MaleCNS 뉴런 위치 점구름" style="width: 150px; height: 100%; min-height: 150px; display: block; background: #070D17;"></canvas>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px;">
<span class="lbl" style="font-size: 11px;">FDDD 커넥톰 · 보조</span>
<span style="font-size: 14px; line-height: 1.55;">초파리 뇌가 도킹 점수를 보상으로 받아 선호를 학습합니다</span>
<span style="font-size: 13px; line-height: 1.6; color: var(--warn);">FDDD 자체 대조에서 분자 전용 기준선(0.786)이 더 높아, 후보 선별 근거로는 쓰지 않습니다</span>
</div>
</section>
</div>
</div>

<div class="card" style="display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; overflow: hidden; flex-shrink: 0;">
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--line);">
<span class="lbl" style="font-size: 11px;">과잉해석 적발 · 8건</span>
<div style="display: flex; align-items: center; gap: 14px;"><span style="font-size: 14px; width: 110px; color: var(--muted2);">규칙만</span><span style="display: block; flex-grow: 1; height: 6px; border-radius: 3px; background: #1B2B3E;"><span class="grow" style="display: block; width: 4%; height: 6px; border-radius: 3px; background: var(--muted);"></span></span><span class="mono" style="font-size: 14px; width: 40px; text-align: right;">0/4</span></div>
<div style="display: flex; align-items: center; gap: 14px;"><span style="font-size: 14px; width: 110px; color: var(--muted2);">+ Nemotron</span><span style="display: block; flex-grow: 1; height: 6px; border-radius: 3px; background: #1B2B3E;"><span class="grow" style="display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--accent); animation-delay: .15s;"></span></span><span class="mono" style="font-size: 14px; width: 40px; text-align: right;">4/4</span></div>
</div>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line);"><span class="lbl" style="font-size: 11px;">정상 오탐</span><span class="mono" style="font-size: 26px; color: var(--warn);">1 / 4</span></div>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line);"><span class="lbl" style="font-size: 11px;">실행된 도킹</span><span class="mono" style="font-size: 26px;">8 <span style="font-size: 13px; color: var(--muted2);">runs · 3 타깃</span></span></div>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px;"><span class="lbl" style="font-size: 11px;">ChEMBL 실측 대조</span><span class="mono" style="font-size: 26px;">5 <span style="font-size: 13px; color: var(--muted2);">/ 8 조합</span></span></div>
</div>

</div>
<section class="card" style="display: grid; grid-template-columns: 430px minmax(0, 1fr); overflow: hidden; flex-shrink: 0;">
<canvas ref="{{ scatRef }}" aria-label="ChEMBL 실측 pChEMBL 대 Boltz-2 예측 pIC50 산점도" style="width: 430px; height: 300px; display: block; background: #070D17;"></canvas>
<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: baseline; gap: 14px;">
<h2 class="h2">친화도 예측 벤치마크</h2>
<span style="font-size: 13px; color: var(--muted2);">PARP1 활성 화합물 39종 · ChEMBL IC50 중앙값을 정답지로</span>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 4px;"><span class="lbl" style="font-size: 11px;">Spearman</span><span class="mono" style="font-size: 24px; color: var(--ok);">0.767</span></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><span class="lbl" style="font-size: 11px;">MAE</span><span class="mono" style="font-size: 24px;">0.71</span><span style="font-size: 12px; color: var(--muted2);">log 단위</span></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><span class="lbl" style="font-size: 11px;">Enrichment</span><span class="mono" style="font-size: 24px;">2.41</span><span style="font-size: 12px; color: var(--muted2);">상위 25% 중 5/9</span></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><span class="lbl" style="font-size: 11px;">민감도 · 특이도</span><span class="mono" style="font-size: 24px;">.80 / .86</span><span style="font-size: 12px; color: var(--muted2);">pIC50 ≥ 7 기준</span></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><span class="lbl" style="font-size: 11px;">포즈 RMSD ≤ 2Å</span><span class="mono" style="font-size: 24px; color: var(--ok);">3 / 3</span><span style="font-size: 12px; color: var(--muted2);">재도킹 대조</span></div>
</div>
<div style="display: flex; gap: 18px; font-size: 12px; color: var(--muted2);">
<span style="display: flex; align-items: center; gap: 7px;"><span style="width: 9px; height: 9px; border-radius: 50%; background: #70F2B8;"></span>오차 0.5 이내</span>
<span style="display: flex; align-items: center; gap: 7px;"><span style="width: 9px; height: 9px; border-radius: 50%; background: #FFC445;"></span>0.5–1.0</span>
<span style="display: flex; align-items: center; gap: 7px;"><span style="width: 9px; height: 9px; border-radius: 50%; background: #FF8B35;"></span>1.0 초과</span>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.65; color: var(--muted2);"><b style="color: var(--warn);">한계.</b> ChEMBL IC50은 측정 조건이 실험마다 달라 정답지 자체에 폭이 있습니다. 39종은 PARP1 한 타깃이라 다른 타깃으로 일반화할 수 없고, 상관이 높다고 개별 화합물 예측을 신뢰할 근거도 아닙니다. 가장 큰 오차는 1.76 log 단위입니다.</p>
</div>
</section>

<footer class="foot" style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 32px; border-top: 1px solid var(--line); flex-shrink: 0;"><span>Built with <a href="https://github.com/cobanov/fly-connectome-template">fly-connectome-template</a> by <a href="https://github.com/cobanov">Mert Cobanov</a> · UI adapted from <a href="https://github.com/AwesomeZun/FDDD">FDDD</a></span><span>MaleCNS v1.0 · FlyEM / HHMI Janelia · CC BY 4.0</span></footer>
</div>
</template>
<div id="app"></div>
<script src="./dc-shim.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tgt: 'parp1', sel: 2, k: 0 };
    var self = this;
    this.structRef = function (el) { self.sc = el; };
    this.brainRef = function (el) { self.bc = el; };
    this.scatRef = function (el) { self.sx = el; };
    this.BENCH = [[5.93, 7.523], [6.46, 5.541], [6.0, 5.392], [6.11, 6.223], [4.88, 5.627], [6.46, 6.991], [6.07, 6.639], [6.12, 6.564], [5.02, 5.904], [5.33, 6.277], [6.36, 6.095], [5.92, 5.989], [7.79, 9.021], [7.21, 6.277], [7.45, 9.207], [7.89, 7.118], [6.73, 7.321], [7.44, 7.001], [7.34, 6.415], [7.89, 8.749], [7.35, 5.754], [7.01, 6.458], [6.82, 6.266], [7.19, 7.177], [7.8, 8.474], [7.64, 7.611], [8.3, 9.825], [8.5, 8.098], [9.22, 8.898], [8.84, 8.677], [8.76, 9.351], [8.89, 7.744], [8.85, 8.653], [8.52, 7.502], [8.25, 6.628], [8.62, 8.392], [8.52, 7.526], [8.25, 7.956], [9.0, 8.602]];
    this.C = [
      { k: '15r@parp1', p: 'parp1', t: 'PARP1', name: '15R', s: -13.093, role: 'PARP1 리간드', kind: 'in' },

      claims: claims.map(function (c, j) { return { text: c.text, reason: c.reason, ev: c.ev, verdict: c.v, vb: VC[c.v][0], vc: VC[c.v][1], d0: (0.1 + j * 0.12).toFixed(2) + 's' }; }),

        : { label: '미조회', faers: '미조회', note: s.kind === 'ctrl' ? '재도킹 대조 리간드는 사람 데이터 조회 대상이 아닙니다.' : '이 후보는 아직 사람 데이터를 조회하지 않았습니다.' }
